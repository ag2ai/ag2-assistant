# AG2 Assistant — self-hosted deployment.
#
#   cp .env.example .env      # add GEMINI_API_KEY (or another provider key)
#   docker compose up -d      # build + run; open http://localhost:8800/
#
# Or pull the prebuilt image instead of building: comment out `build:` and set
#   image: ghcr.io/ag2ai/ag2-assistant:latest
#
# NOTE: the gateway has no auth of its own. Publish 8800 only on a trusted network,
# or put it behind a reverse proxy that terminates TLS and handles authentication.
services:
  ag2-assistant:
    build: .
    image: ghcr.io/ag2ai/ag2-assistant:latest
    ports:
      - "8800:8800"
      # Port 1455 (the "Sign in with ChatGPT" OAuth callback) is deliberately NOT
      # published. The browser redirect to localhost:1455 will dead-end with
      # "localhost refused to connect" — that is EXPECTED, and the sign-in modal
      # says so: click "Paste the code manually", paste the URL from the dead tab's
      # address bar (or just its `code=` value), and the flow completes. The token
      # then persists in /data and refreshes itself, so this is a one-time step.
      #
      # We don't publish 1455 because it would be held for the entire life of the
      # container just to serve a one-off login — and while held it silently BREAKS
      # ChatGPT sign-in in other tools (Codex CLI, the VS Code extension), which
      # share OpenAI's OAuth client and its hardcoded localhost:1455 redirect. The
      # failure isn't a clean "port in use": Docker also publishes on the IPv6
      # wildcard and `localhost` resolves to ::1 first on macOS, so the other tool's
      # callback is swallowed by this container while it waits for a redirect that
      # never arrives.
    # Provider keys and channel tokens (GEMINI_API_KEY, OPENAI_API_KEY,
    # TELEGRAM_BOT_TOKEN, ...). Optional: keys can also be set via onboarding/Settings
    # and persist in the data volume, so booting without a .env is fine.
    env_file:
      - path: .env
        required: false
    environment:
      # In-container code execution — the container is the sandbox (see the
      # docker-out-of-docker block below to change this).
      AG2ASSISTANT_SANDBOX: local
    volumes:
      # Persistent state: secrets, profiles, config, memory, tasks.
      - ag2_data:/data
      # The agent's readable/writable file workspace (generated images, outputs).
      - ag2_workspace:/workspace
    restart: unless-stopped

    # --- Optional: docker-out-of-docker code execution -----------------------
    # Let the agent spawn real sibling sandbox containers instead of running code
    # in-process. Stronger per-run isolation, but mounting the host Docker socket
    # grants this container control of the host Docker daemon — enable only if you
    # accept that.
    #
    # To enable, make three edits ABOVE (don't add a second `environment:` or
    # `volumes:` key — YAML rejects duplicates):
    #
    #   1. environment: set AG2ASSISTANT_SANDBOX: docker
    #   2. volumes:     add  - /var/run/docker.sock:/var/run/docker.sock
    #   3. add the `group_add:` key below, uncommented.
    #
    # group_add is REQUIRED. The container runs as non-root (uid 10001), but the
    # socket is owned by root and group-readable only — so without this the app
    # user gets EACCES, `docker info` fails, docker_available() returns False, and
    # the assistant SILENTLY falls back to the local sandbox (a log warning is the
    # only clue). Set it to the GID that owns /var/run/docker.sock on YOUR host:
    #
    #   Linux:          stat -c '%g' /var/run/docker.sock   # the `docker` group, often 999
    #   Docker Desktop: 0                                   # socket is root:root
    #
    # group_add:
    #   - "999"

volumes:
  ag2_data:
  ag2_workspace:
