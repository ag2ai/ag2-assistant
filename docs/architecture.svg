<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="system-ui, -apple-system, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arrowA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f95339"/>
    </marker>
    <style>
      .box{fill:#fafafa;stroke:#d9d9d9;stroke-width:1.5}
      .accent{fill:#fff4f1;stroke:#f95339;stroke-width:2}
      .spine{fill:#fff0ec;stroke:#f95339;stroke-width:2.5}
      .found{fill:#f3f3f3;stroke:#cfcfcf;stroke-width:1.5}
      .pill{fill:#fff;stroke:#cfcfcf;stroke-width:1}
      .t{fill:#1a1a1a} .m{fill:#777;font-size:11px} .h{font-weight:700;fill:#1a1a1a}
      .ac{fill:#f95339;font-weight:700} .lbl{fill:#888;font-size:11px}
      .ln{stroke:#888;stroke-width:1.5;fill:none}
      .lnA{stroke:#f95339;stroke-width:2;fill:none}
    </style>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="20" class="h">AGClaw — event-stream architecture</text>
  <text x="500" y="50" text-anchor="middle" class="m">AG2 Stream is the source of truth; everything is a projection of it (wire = log = {type, data})</text>

  <!-- Clients -->
  <rect x="60"  y="72" width="250" height="58" rx="10" class="box"/>
  <text x="185" y="98" text-anchor="middle" class="h">Web UI — Svelte SPA</text>
  <text x="185" y="116" text-anchor="middle" class="m">/app · projects events → bubbles, chips, cards</text>

  <rect x="375" y="72" width="250" height="58" rx="10" class="box"/>
  <text x="500" y="98" text-anchor="middle" class="h">Channels</text>
  <text x="500" y="116" text-anchor="middle" class="m">Telegram · Discord · Slack</text>

  <rect x="690" y="72" width="250" height="58" rx="10" class="box"/>
  <text x="815" y="98" text-anchor="middle" class="h">CLI / other clients</text>
  <text x="815" y="116" text-anchor="middle" class="m">the gateway API is the only contract</text>

  <path class="ln" d="M185 130 V 166" marker-end="url(#arrow)"/>
  <path class="ln" d="M500 130 V 166" marker-end="url(#arrow)"/>
  <path class="ln" d="M815 130 V 166" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="60" y="168" width="880" height="92" rx="10" class="box"/>
  <text x="78" y="190" class="h">Gateway (FastAPI)</text>
  <text x="820" y="190" class="m">StreamBridge · emit_event · per-session lock</text>
  <rect x="78"  y="204" width="180" height="42" rx="14" class="pill"/>
  <text x="168" y="222" text-anchor="middle" class="ac">WS /api/stream</text>
  <text x="168" y="238" text-anchor="middle" class="m">replay + live events</text>
  <rect x="270" y="204" width="170" height="42" rx="14" class="pill"/>
  <text x="355" y="222" text-anchor="middle" class="ac">WS /api/voice</text>
  <text x="355" y="238" text-anchor="middle" class="m">Gemini Live PCM</text>
  <rect x="452" y="204" width="300" height="42" rx="14" class="pill"/>
  <text x="602" y="222" text-anchor="middle" class="h">REST</text>
  <text x="602" y="238" text-anchor="middle" class="m">/api/tasks · /api/inquiries · /api/sessions · /api/google</text>
  <rect x="764" y="204" width="158" height="42" rx="14" class="pill"/>
  <text x="843" y="229" text-anchor="middle" class="h">/app static</text>

  <path class="lnA" d="M500 260 V 300" marker-end="url(#arrowA)"/>
  <text x="512" y="284" class="lbl">subscribe · run turns · emit</text>

  <!-- Spine -->
  <rect x="60" y="302" width="880" height="86" rx="12" class="spine"/>
  <text x="500" y="328" text-anchor="middle" class="ac" font-size="15">Per-session AG2 event Streams</text>
  <text x="500" y="348" text-anchor="middle" class="t">web-… · task:&lt;id&gt; · voice:&lt;id&gt;  —  one wire = log shape: { type, data }</text>
  <text x="500" y="368" text-anchor="middle" class="m">history (replay) and live (subscribe) are the same path · persisted by EventLogWriter</text>

  <!-- producers/consumers -->
  <rect x="60" y="430" width="270" height="96" rx="10" class="accent"/>
  <text x="195" y="453" text-anchor="middle" class="h">Universal Agent</text>
  <text x="195" y="472" text-anchor="middle" class="m">one agent, all surfaces</text>
  <text x="195" y="490" text-anchor="middle" class="m">tools · system tools · knowledge</text>
  <text x="195" y="508" text-anchor="middle" class="m">LoggingMiddleware · cheap model</text>

  <rect x="365" y="430" width="270" height="96" rx="10" class="box"/>
  <text x="500" y="453" text-anchor="middle" class="h">Voice — LiveAgent</text>
  <text x="500" y="472" text-anchor="middle" class="m">Gemini Live (basic tools)</text>
  <text x="500" y="490" text-anchor="middle" class="m">ask_assistant → delegates to</text>
  <text x="500" y="508" text-anchor="middle" class="m">the universal agent; transcripts persisted</text>

  <rect x="670" y="430" width="270" height="96" rx="10" class="box"/>
  <text x="805" y="453" text-anchor="middle" class="h">Task engine</text>
  <text x="805" y="472" text-anchor="middle" class="m">TaskStore · runner · scheduler</text>
  <text x="805" y="490" text-anchor="middle" class="m">durable, nestable, deliverables</text>
  <text x="805" y="508" text-anchor="middle" class="ac">emits Task*/Deliverable events</text>

  <path class="lnA" d="M195 430 V 390" marker-end="url(#arrowA)"/>
  <path class="ln"  d="M215 390 V 430" marker-end="url(#arrow)"/>
  <path class="lnA" d="M500 430 V 390" marker-end="url(#arrowA)"/>
  <path class="lnA" d="M805 430 V 390" marker-end="url(#arrowA)"/>

  <!-- cross-cutting -->
  <rect x="60" y="556" width="270" height="62" rx="10" class="box"/>
  <text x="195" y="579" text-anchor="middle" class="h">Durable HITL</text>
  <text x="195" y="598" text-anchor="middle" class="m">InquiryStore · Asker · Inquiry* events</text>

  <rect x="365" y="556" width="270" height="62" rx="10" class="box"/>
  <text x="500" y="579" text-anchor="middle" class="h">Permissions</text>
  <text x="500" y="598" text-anchor="middle" class="m">turn-level PermissionManager</text>

  <rect x="670" y="556" width="270" height="62" rx="10" class="box"/>
  <text x="805" y="579" text-anchor="middle" class="h">Observability</text>
  <text x="805" y="598" text-anchor="middle" class="m">agclaw.log · failure snapshots</text>

  <rect x="60" y="632" width="430" height="50" rx="10" class="box"/>
  <text x="275" y="655" text-anchor="middle" class="h">Memory</text>
  <text x="275" y="672" text-anchor="middle" class="m">passive user profile (WorkingMemory, cheap model)</text>
  <rect x="510" y="632" width="430" height="50" rx="10" class="box"/>
  <text x="725" y="655" text-anchor="middle" class="h">Google</text>
  <text x="725" y="672" text-anchor="middle" class="m">OAuth · Gmail/Calendar/Drive (writes HITL-gated)</text>

  <!-- Storage -->
  <rect x="60" y="696" width="880" height="44" rx="10" class="found"/>
  <text x="78" y="723" class="h">Storage ~/.agclaw/</text>
  <text x="922" y="723" text-anchor="end" class="m">sessions.db · tasks.db · inquiries.db · profile.db · permissions.json · debug/ · skills/</text>

  <!-- AG2 foundation -->
  <rect x="60" y="752" width="880" height="44" rx="10" class="found"/>
  <text x="500" y="779" text-anchor="middle" class="h">AG2 Beta · Stream · event taxonomy · observers/subscribe · EventLogWriter · KnowledgeConfig · LiveAgent</text>
</svg>
