<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" font-family="system-ui, -apple-system, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowback" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#f95339"/>
    </marker>
  </defs>
  <style>
    .layer { font-size: 11px; fill: #999; font-weight: 700; letter-spacing: 1px; }
    .lbl { font-weight: 700; font-size: 14px; }
    .det { font-size: 11px; fill: #555; }
    .conn { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .hitl { stroke: #f95339; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowback); }
    .planned { stroke-dasharray: 5 3; }
    .note { font-size: 11px; fill: #777; font-style: italic; }
  </style>

  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#222">AGClaw Architecture</text>
  <text x="490" y="48" text-anchor="middle" class="note">AG2 Beta 0.13 · Python backend · solid = built, dashed = planned</text>

  <!-- Clients -->
  <text x="55" y="54" class="layer">CLIENTS</text>
  <rect x="55" y="60" width="95" height="38" rx="8" fill="#E8F4FD" stroke="#7CB9E8"/>
  <text x="102" y="84" text-anchor="middle" class="lbl" fill="#2B6CB0">CLI</text>
  <rect x="160" y="60" width="95" height="38" rx="8" fill="#E8F4FD" stroke="#7CB9E8" class="planned"/>
  <text x="207" y="84" text-anchor="middle" class="lbl" fill="#2B6CB0">Web</text>
  <rect x="265" y="60" width="100" height="38" rx="8" fill="#E8F4FD" stroke="#7CB9E8" class="planned"/>
  <text x="315" y="84" text-anchor="middle" class="lbl" fill="#2B6CB0">Desktop</text>

  <!-- Channels (now built) -->
  <text x="560" y="54" class="layer">CHANNELS (live)</text>
  <rect x="560" y="60" width="100" height="38" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="610" y="84" text-anchor="middle" class="lbl" fill="#92400E">Telegram</text>
  <rect x="668" y="60" width="90" height="38" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="713" y="84" text-anchor="middle" class="lbl" fill="#92400E">Discord</text>
  <rect x="766" y="60" width="80" height="38" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="806" y="84" text-anchor="middle" class="lbl" fill="#92400E">Slack</text>
  <rect x="854" y="60" width="95" height="38" rx="8" fill="#FEF3C7" stroke="#D97706" class="planned"/>
  <text x="901" y="84" text-anchor="middle" class="lbl" fill="#92400E">WhatsApp</text>

  <!-- arrows to gateway -->
  <line x1="102" y1="98" x2="180" y2="158" class="conn"/>
  <line x1="207" y1="98" x2="240" y2="158" class="conn"/>
  <line x1="315" y1="98" x2="300" y2="158" class="conn"/>
  <line x1="700" y1="98" x2="540" y2="158" class="conn"/>

  <text x="100" y="118" class="det">REST + WebSocket</text>

  <!-- Gateway -->
  <text x="30" y="150" class="layer">GATEWAY</text>
  <rect x="55" y="156" width="500" height="78" rx="8" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="305" y="180" text-anchor="middle" class="lbl" fill="#166534">Gateway — FastAPI facade (agclaw.gateway)</text>
  <text x="160" y="204" text-anchor="middle" class="det">REST /api/message · WS /api/ws</text>
  <text x="430" y="204" text-anchor="middle" class="det">GET /api/health</text>
  <text x="305" y="224" text-anchor="middle" class="det">Session manager — one isolated AgentReply chain per session_id</text>

  <line x1="305" y1="234" x2="305" y2="270" class="conn"/>

  <!-- Agent -->
  <text x="30" y="266" class="layer">AGENT (AG2 Beta)</text>
  <rect x="55" y="272" width="430" height="120" rx="8" fill="#F3E8FF" stroke="#A855F7"/>
  <text x="270" y="296" text-anchor="middle" class="lbl" fill="#581C87">AG2 Agent — agclaw.agent</text>
  <text x="270" y="318" text-anchor="middle" class="det">System prompt + live env (date/time/location)</text>
  <text x="270" y="338" text-anchor="middle" class="det">Gemini · gemini-3.5-flash (multi-provider)</text>
  <text x="160" y="364" text-anchor="middle" class="det">Tools:</text>
  <text x="160" y="380" text-anchor="middle" class="det">search · web_fetch</text>
  <text x="380" y="364" text-anchor="middle" class="det">read_file (vision) 🔒</text>
  <text x="380" y="380" text-anchor="middle" class="det">shell 🔒 · code 🔒 · skills</text>

  <!-- HITL & Permissions (NEW) -->
  <text x="545" y="266" class="layer">HITL &amp; PERMISSIONS</text>
  <rect x="545" y="272" width="400" height="120" rx="8" fill="#FFEDE9" stroke="#f95339"/>
  <text x="745" y="296" text-anchor="middle" class="lbl" fill="#b3361f">HITL &amp; Permissions</text>
  <text x="745" y="318" text-anchor="middle" class="det">PermissionManager — one per turn, shared by all</text>
  <text x="745" y="334" text-anchor="middle" class="det">access tools (folders + shell/code)</text>
  <text x="745" y="354" text-anchor="middle" class="det">Allow once / Always allow / Deny</text>
  <text x="745" y="372" text-anchor="middle" class="det">Asker → chat buttons or desktop /hitl page</text>
  <text x="745" y="388" text-anchor="middle" class="det">turn-sticky · denials never enter memory</text>

  <!-- agent <-> permissions (tools call the manager; manager asks back via Asker) -->
  <line x1="485" y1="332" x2="543" y2="332" class="conn"/>
  <path d="M 745 392 L 745 420 L 305 420 L 305 408" class="hitl"/>
  <text x="600" y="436" text-anchor="middle" class="note" fill="#b3361f">prompt routed back to the requesting client/channel</text>

  <line x1="270" y1="392" x2="270" y2="452" class="conn"/>

  <!-- Memory -->
  <text x="30" y="448" class="layer">SESSION &amp; MEMORY</text>
  <rect x="55" y="454" width="430" height="88" rx="8" fill="#FFF7ED" stroke="#F97316"/>
  <text x="270" y="478" text-anchor="middle" class="lbl" fill="#9A3412">Session &amp; Memory — agclaw.memory</text>
  <text x="270" y="500" text-anchor="middle" class="det">Conversation: per-session AgentReply chains (isolated)</text>
  <text x="270" y="520" text-anchor="middle" class="det">Profile (passive): WorkingMemoryAggregate / Policy</text>
  <text x="270" y="536" text-anchor="middle" class="det">(permission decisions excluded)</text>

  <!-- Config & providers -->
  <text x="545" y="448" class="layer">CONFIG &amp; PROVIDERS</text>
  <rect x="545" y="454" width="400" height="88" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="745" y="478" text-anchor="middle" class="lbl" fill="#166534">Configuration — Pydantic / .env</text>
  <text x="745" y="500" text-anchor="middle" class="det">LLM · Agent (incl. location) · Channels · Gateway</text>
  <text x="745" y="520" text-anchor="middle" class="det">Providers: Gemini · OpenAI · Anthropic · Ollama</text>

  <line x1="270" y1="542" x2="270" y2="578" class="conn"/>

  <!-- Storage -->
  <text x="30" y="574" class="layer">STORAGE (~/.agclaw)</text>
  <rect x="80" y="580" width="180" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="170" y="600" text-anchor="middle" class="lbl" fill="#475569">profile.db</text>
  <text x="170" y="616" text-anchor="middle" class="det">learned profile (SQLite)</text>
  <rect x="280" y="580" width="200" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="380" y="600" text-anchor="middle" class="lbl" fill="#475569">permissions.json</text>
  <text x="380" y="616" text-anchor="middle" class="det">persisted folder grants</text>

  <!-- Distributed note -->
  <rect x="55" y="660" width="890" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="70" y="682" class="lbl" fill="#334155">Distributed / multi-agent (validated spike)</text>
  <text x="70" y="702" class="det">The agent can also be served over WebSocket through an AG2 Hub (serve_ws) for cross-machine / multi-agent deployments — examples/network_gateway_spike.py.</text>

  <!-- Legend -->
  <rect x="55" y="740" width="15" height="15" rx="3" fill="#E8F4FD" stroke="#7CB9E8"/>
  <text x="77" y="752" font-size="11" fill="#666">Clients</text>
  <rect x="140" y="740" width="15" height="15" rx="3" fill="#FEF3C7" stroke="#D97706"/>
  <text x="162" y="752" font-size="11" fill="#666">Channels</text>
  <rect x="235" y="740" width="15" height="15" rx="3" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="257" y="752" font-size="11" fill="#666">Gateway</text>
  <rect x="325" y="740" width="15" height="15" rx="3" fill="#F3E8FF" stroke="#A855F7"/>
  <text x="347" y="752" font-size="11" fill="#666">Agent</text>
  <rect x="405" y="740" width="15" height="15" rx="3" fill="#FFEDE9" stroke="#f95339"/>
  <text x="427" y="752" font-size="11" fill="#666">HITL/Perms</text>
  <rect x="500" y="740" width="15" height="15" rx="3" fill="#FFF7ED" stroke="#F97316"/>
  <text x="522" y="752" font-size="11" fill="#666">Memory</text>
  <text x="590" y="752" font-size="11" fill="#666">🔒 = permission-gated</text>
  <line x1="730" y1="748" x2="760" y2="748" stroke="#666" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="767" y="752" font-size="11" fill="#666">planned</text>
</svg>
