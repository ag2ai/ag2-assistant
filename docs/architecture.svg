<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" font-family="system-ui, -apple-system, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowback" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#f95339"/>
    </marker>
  </defs>
  <style>
    .layer { font-size: 11px; fill: #999; font-weight: 700; letter-spacing: 1px; }
    .lbl { font-weight: 700; font-size: 14px; }
    .det { font-size: 11px; fill: #555; }
    .conn { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .hitl { stroke: #f95339; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowback); }
    .planned { stroke-dasharray: 5 3; }
    .note { font-size: 11px; fill: #777; font-style: italic; }
  </style>

  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#222">AGClaw Architecture</text>
  <text x="500" y="46" text-anchor="middle" class="note">AG2 Beta 0.13 · Python backend · solid = built, dashed = planned / in progress</text>

  <!-- Clients -->
  <text x="55" y="72" class="layer">CLIENTS</text>
  <rect x="55" y="78" width="90" height="36" rx="8" fill="#E8F4FD" stroke="#7CB9E8"/>
  <text x="100" y="101" text-anchor="middle" class="lbl" fill="#2B6CB0">CLI</text>
  <rect x="152" y="78" width="100" height="36" rx="8" fill="#E8F4FD" stroke="#7CB9E8"/>
  <text x="202" y="101" text-anchor="middle" class="lbl" fill="#2B6CB0">Web UI</text>
  <rect x="259" y="78" width="95" height="36" rx="8" fill="#E8F4FD" stroke="#7CB9E8" class="planned"/>
  <text x="306" y="101" text-anchor="middle" class="lbl" fill="#2B6CB0">Desktop</text>

  <!-- Channels -->
  <text x="560" y="72" class="layer">CHANNELS (live)</text>
  <rect x="560" y="78" width="92" height="36" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="606" y="101" text-anchor="middle" class="lbl" fill="#92400E">Telegram</text>
  <rect x="659" y="78" width="82" height="36" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="700" y="101" text-anchor="middle" class="lbl" fill="#92400E">Discord</text>
  <rect x="748" y="78" width="70" height="36" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="783" y="101" text-anchor="middle" class="lbl" fill="#92400E">Slack</text>
  <rect x="825" y="78" width="100" height="36" rx="8" fill="#FEF3C7" stroke="#D97706" class="planned"/>
  <text x="875" y="101" text-anchor="middle" class="lbl" fill="#92400E">WhatsApp</text>

  <!-- arrows to gateway -->
  <line x1="100" y1="114" x2="260" y2="168" class="conn"/>
  <line x1="202" y1="114" x2="340" y2="168" class="conn"/>
  <line x1="700" y1="114" x2="640" y2="168" class="conn"/>
  <text x="120" y="134" class="det">Web UI · REST · WebSocket</text>

  <!-- Gateway -->
  <text x="55" y="162" class="layer">GATEWAY</text>
  <rect x="55" y="168" width="870" height="92" rx="8" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="490" y="190" text-anchor="middle" class="lbl" fill="#166534">Gateway — FastAPI facade (agclaw.gateway) · serves the Web UI · agclaw run = gateway + all channels</text>
  <text x="490" y="212" text-anchor="middle" class="det">GET / (web UI) · POST /api/message · WS /api/ws (thinking·reply·question·cancelled·error)</text>
  <text x="490" y="230" text-anchor="middle" class="det">/api/sessions · /api/tasks · /api/inquiries · /api/hitl · /api/google · /api/health</text>
  <text x="490" y="250" text-anchor="middle" class="det">Resumable per-session AG2 Streams (EventLogWriter → sessions.db) · per-session lock · turn timeout</text>

  <line x1="270" y1="260" x2="270" y2="296" class="conn"/>

  <!-- Agent -->
  <text x="55" y="292" class="layer">AGENT (AG2 Beta)</text>
  <rect x="55" y="298" width="455" height="146" rx="8" fill="#F3E8FF" stroke="#A855F7"/>
  <text x="282" y="320" text-anchor="middle" class="lbl" fill="#581C87">AG2 Agent — agclaw.agent</text>
  <text x="282" y="340" text-anchor="middle" class="det">Prompt: persona + behaviour guidance + live env (+ Google guidance when signed in)</text>
  <text x="282" y="358" text-anchor="middle" class="det">Multi-provider: Gemini (default) · OpenAI · Anthropic</text>
  <text x="170" y="384" text-anchor="middle" class="det">search · web_fetch</text>
  <text x="170" y="402" text-anchor="middle" class="det">read_file (vision) 🔒</text>
  <text x="170" y="420" text-anchor="middle" class="det">skills (registry + bundled)</text>
  <text x="400" y="384" text-anchor="middle" class="det">shell 🔒 · code 🔒</text>
  <text x="400" y="402" text-anchor="middle" class="det">(sandbox: local / docker)</text>
  <text x="400" y="420" text-anchor="middle" class="det">gmail · calendar · drive 🔒</text>

  <!-- HITL & Permissions -->
  <text x="535" y="292" class="layer">HITL &amp; PERMISSIONS</text>
  <rect x="535" y="298" width="390" height="146" rx="8" fill="#FFEDE9" stroke="#f95339"/>
  <text x="730" y="320" text-anchor="middle" class="lbl" fill="#b3361f">HITL &amp; Permissions</text>
  <text x="730" y="342" text-anchor="middle" class="det">PermissionManager — one per turn, shared by all</text>
  <text x="730" y="358" text-anchor="middle" class="det">access tools (folders + shell/code; sends/writes)</text>
  <text x="730" y="378" text-anchor="middle" class="det">Allow once / Always allow / Deny · turn-sticky</text>
  <text x="730" y="396" text-anchor="middle" class="det">Asker → chat buttons · desktop &amp; gateway /hitl page</text>
  <text x="730" y="414" text-anchor="middle" class="det">Durable Inquiries — persisted, task-tied (inquiries.db),</text>
  <text x="730" y="430" text-anchor="middle" class="det">answerable from any channel · denials never enter memory</text>

  <line x1="510" y1="360" x2="533" y2="360" class="conn"/>
  <path d="M 730 444 L 730 462 L 282 462 L 282 446" class="hitl"/>
  <text x="500" y="478" text-anchor="middle" class="note" fill="#b3361f">prompt routed back to the requesting client / channel</text>

  <line x1="160" y1="444" x2="160" y2="500" class="conn"/>
  <line x1="400" y1="444" x2="400" y2="500" class="conn"/>

  <!-- Tasks -->
  <text x="55" y="496" class="layer">TASKS</text>
  <rect x="55" y="502" width="455" height="92" rx="8" fill="#E0E7FF" stroke="#6366F1"/>
  <text x="282" y="522" text-anchor="middle" class="lbl" fill="#3730A3">Tasks — agclaw.tasks</text>
  <text x="282" y="540" text-anchor="middle" class="det">nestable tree · iterative HITL intake · capability-scoped agents</text>
  <text x="282" y="557" text-anchor="middle" class="det">deliverable verify + grounding gate · resilient parents · live amend</text>
  <text x="282" y="574" text-anchor="middle" class="det">concurrent cascade-cancel runner · cheap model for leaf subtasks</text>
  <text x="282" y="589" text-anchor="middle" class="det" fill="#6366F1">tasks.db · gateway API + Tasks GUI built · scheduler: in progress</text>

  <!-- Session & Memory -->
  <text x="535" y="496" class="layer">SESSION &amp; MEMORY</text>
  <rect x="535" y="502" width="390" height="92" rx="8" fill="#FFF7ED" stroke="#F97316"/>
  <text x="730" y="524" text-anchor="middle" class="lbl" fill="#9A3412">Session &amp; Memory — agclaw.memory</text>
  <text x="730" y="546" text-anchor="middle" class="det">Conversation: resumable per-session streams (sessions.db)</text>
  <text x="730" y="564" text-anchor="middle" class="det">Profile (passive): WorkingMemoryAggregate / Policy (profile.db)</text>
  <text x="730" y="582" text-anchor="middle" class="det">batched cadence · permission decisions excluded</text>

  <!-- Google -->
  <text x="55" y="624" class="layer">GOOGLE</text>
  <rect x="55" y="630" width="455" height="72" rx="8" fill="#FFF1F2" stroke="#FB7185"/>
  <text x="282" y="652" text-anchor="middle" class="lbl" fill="#9F1239">Google — Gmail / Calendar / Drive (agclaw.integrations)</text>
  <text x="282" y="674" text-anchor="middle" class="det">OAuth (CLI or web panel) · token cached &amp; refreshed</text>
  <text x="282" y="692" text-anchor="middle" class="det">reads run freely · sends / writes HITL-gated</text>

  <!-- Config -->
  <text x="535" y="624" class="layer">CONFIG &amp; PROVIDERS</text>
  <rect x="535" y="630" width="390" height="72" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="730" y="652" text-anchor="middle" class="lbl" fill="#166534">Configuration — Pydantic</text>
  <text x="730" y="674" text-anchor="middle" class="det">env (AGCLAW_*) &gt; ~/.agclaw/config.json &gt; defaults</text>
  <text x="730" y="692" text-anchor="middle" class="det">Gemini · OpenAI · Anthropic</text>

  <!-- Storage -->
  <text x="55" y="726" class="layer">STORAGE (~/.agclaw)</text>
  <rect x="55" y="732" width="132" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="121" y="751" text-anchor="middle" class="lbl" fill="#475569">profile.db</text>
  <text x="121" y="766" text-anchor="middle" class="det">learned profile</text>
  <rect x="195" y="732" width="132" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="261" y="751" text-anchor="middle" class="lbl" fill="#475569">sessions.db</text>
  <text x="261" y="766" text-anchor="middle" class="det">resumable chats</text>
  <rect x="335" y="732" width="110" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="390" y="751" text-anchor="middle" class="lbl" fill="#475569">tasks.db</text>
  <text x="390" y="766" text-anchor="middle" class="det">tasks</text>
  <rect x="453" y="732" width="132" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="519" y="751" text-anchor="middle" class="lbl" fill="#475569">inquiries.db</text>
  <text x="519" y="766" text-anchor="middle" class="det">durable HITL</text>
  <rect x="593" y="732" width="150" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="668" y="751" text-anchor="middle" class="lbl" fill="#475569">permissions.json</text>
  <text x="668" y="766" text-anchor="middle" class="det">folder grants</text>
  <rect x="751" y="732" width="174" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="838" y="751" text-anchor="middle" class="lbl" fill="#475569">google_token.json</text>
  <text x="838" y="766" text-anchor="middle" class="det">OAuth (+ credentials)</text>

  <!-- Distributed note -->
  <rect x="55" y="788" width="870" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="70" y="806" class="lbl" fill="#334155">Distributed / multi-agent (validated spike)</text>
  <text x="70" y="822" class="det">The agent can also be served over WebSocket through an AG2 Hub (serve_ws) for cross-machine / multi-agent deployments.</text>

  <!-- Legend -->
  <rect x="55" y="846" width="14" height="14" rx="3" fill="#E8F4FD" stroke="#7CB9E8"/>
  <text x="74" y="857" font-size="11" fill="#666">Clients</text>
  <rect x="130" y="846" width="14" height="14" rx="3" fill="#FEF3C7" stroke="#D97706"/>
  <text x="149" y="857" font-size="11" fill="#666">Channels</text>
  <rect x="218" y="846" width="14" height="14" rx="3" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="237" y="857" font-size="11" fill="#666">Gateway</text>
  <rect x="305" y="846" width="14" height="14" rx="3" fill="#F3E8FF" stroke="#A855F7"/>
  <text x="324" y="857" font-size="11" fill="#666">Agent</text>
  <rect x="375" y="846" width="14" height="14" rx="3" fill="#FFEDE9" stroke="#f95339"/>
  <text x="394" y="857" font-size="11" fill="#666">HITL/Perms</text>
  <rect x="468" y="846" width="14" height="14" rx="3" fill="#E0E7FF" stroke="#6366F1"/>
  <text x="487" y="857" font-size="11" fill="#666">Tasks</text>
  <rect x="535" y="846" width="14" height="14" rx="3" fill="#FFF1F2" stroke="#FB7185"/>
  <text x="554" y="857" font-size="11" fill="#666">Google</text>
  <text x="612" y="857" font-size="11" fill="#666">🔒 = permission-gated</text>
  <line x1="752" y1="853" x2="782" y2="853" stroke="#666" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="789" y="857" font-size="11" fill="#666">planned / WIP</text>
</svg>
