name: Bug Report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Steps to reproduce the behavior:

        1. Step 1
        2. Step 2
        3. See error
      placeholder: How can we replicate the issue?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened?
  - type: textarea
    id: logs
    attributes:
      label: Screenshots and logs
      description: If applicable, add screenshots, console output, or logs to help explain the problem.
      placeholder: Paste relevant logs or attach screenshots here.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - AG2 Assistant version (`ag2-assistant version`):
        - How you're running it (CLI / gateway / Docker):
        - Model provider (Gemini / OpenAI / Anthropic / Ollama):
        - Operating system:
        - Python version:
      placeholder: Fill in the details above.
    validations:
      required: true
