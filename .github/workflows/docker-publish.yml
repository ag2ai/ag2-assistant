# Build and publish the self-hosted image to GitHub Container Registry.
#
# Triggered by a semver tag (e.g. `git tag v0.5.0 && git push --tags`), producing:
#   ghcr.io/<owner>/ag2-assistant:0.5.0
#   ghcr.io/<owner>/ag2-assistant:0.5
#   ghcr.io/<owner>/ag2-assistant:latest
# Keep the tag in sync with assistant.__version__ (the single source of truth).
name: Publish Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # manual: publishes :latest from the default branch

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
