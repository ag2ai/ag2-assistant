# Build and publish the multi-arch self-hosted image to GitHub Container Registry.
#
# Triggered by a semver tag (e.g. `git tag v0.5.0 && git push --tags`), producing:
#   ghcr.io/<owner>/ag2-assistant:0.5.0
#   ghcr.io/<owner>/ag2-assistant:0.5
#   ghcr.io/<owner>/ag2-assistant:latest
# Keep the tag in sync with assistant.__version__ (the single source of truth).
#
# Each tag is a manifest list covering linux/amd64 + linux/arm64, so Apple Silicon
# and ARM servers pull a native image instead of running amd64 under emulation.
#
# Both arches build on NATIVE runners (arm64 on `ubuntu-24.04-arm`, free for public
# repos) rather than cross-building one of them under QEMU. QEMU would roughly
# triple the arm64 build and can segfault on native extension builds; two native
# runners are both faster and more reliable. The cost is the two-job shape below:
# each runner pushes an untagged image BY DIGEST, then `merge` stitches the digests
# into one tagged manifest list. Tags are applied only in `merge` — if a matrix leg
# tagged directly, the second push would overwrite the first rather than join it.
name: Publish Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # manual: publishes :latest from the default branch

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false # a broken arch should report on its own, not mask the other
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only — tags are applied in `merge`, on the manifest list.
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scopes: a shared scope would have the two legs
          # continually evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The digest is the only thing `merge` needs; the filename carries it, so the
      # file itself is empty.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          # Artifact names must be unique per job, and a platform like `linux/amd64`
          # contains a `/`, which artifact names disallow — so index the matrix leg.
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest and tag
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # One manifest list carrying every per-arch digest, published under all tags.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # Fails the run if the published tag isn't a two-arch manifest list, so a
      # silently single-arch release can't slip through.
      - name: Verify both architectures are present
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest}}' > manifest.json
          cat manifest.json | jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' | sort > got.txt
          printf 'linux/amd64\nlinux/arm64\n' > want.txt
          echo "published platforms:"; cat got.txt
          diff want.txt got.txt
