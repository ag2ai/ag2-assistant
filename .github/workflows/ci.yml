name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ruff
        # Pinned to match .pre-commit-config.yaml so local and CI formatting agree.
        run: pip install ruff==0.15.18
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  lockfile:
    name: uv.lock is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28" # matches the pin in Dockerfile
      # The Dockerfile installs with `uv sync --frozen`, which HARD-FAILS when
      # uv.lock disagrees with pyproject.toml. Without this gate, any PR that adds
      # or bumps a dependency without re-running `uv lock` merges green and then
      # breaks the Docker build on main. Fix: run `uv lock` and commit uv.lock.
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28" # matches the pin in Dockerfile
      # Install from the committed uv.lock, so CI, the Dockerfile and local dev all
      # get the same pinned dependency set. (Don't swap this for `pip install -e`:
      # that re-resolves, so CI would silently test a different ag2 than ships.)
      - name: Install (pinned deps via uv.lock)
        run: uv sync --frozen --extra dev --extra google
      - name: Unit tests
        run: uv run pytest -m "not integration" -q

  bundle-fresh:
    name: SPA bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build SPA bundle
        working-directory: web
        run: npm run build
      # The bundle is committed; rebuilding from source must produce no diff.
      # If it does, the committed bundle is stale — rebuild and commit it.
      - name: Verify committed bundle matches source
        run: |
          if [ -n "$(git status --porcelain -- src/assistant/gateway/static/app)" ]; then
            echo "::error::Committed SPA bundle is out of date. Run 'npm --prefix web run build' and commit src/assistant/gateway/static/app/."
            git --no-pager diff --stat -- src/assistant/gateway/static/app
            git status --porcelain -- src/assistant/gateway/static/app
            exit 1
          fi
          echo "SPA bundle matches web/ source ✓"

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run check
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28" # matches the pin in Dockerfile
      - name: Install the package (for the OpenAPI dump)
        run: uv sync --frozen --no-dev
      - name: Unit tests
        working-directory: web
        run: npm test
