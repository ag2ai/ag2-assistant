[build-system]
requires = ["setuptools>=77.0.3"]  # PEP 639: SPDX license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "ag2-assistant"
version = "0.7.0"  # single source of truth (mirrors ag2's own pyproject); assistant.version reads it back from installed metadata
description = "AG2 Assistant — a personal AI assistant powered by AG2's framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Dev installs, CI and the Docker image all resolve this through uv.lock, so they
    # run the same AG2 the published wheel asks for. ddgs powers the native
    # DuckDuckSearchTool. Model provider libraries are extras (see below).
    "ag2[ddgs,acp,ag-ui]>=1.3.0",
    "typer>=0.15.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    # ag2's acp extra requires mcp 2.x; the cap holds at the next major.
    "mcp>=2.2.0,<3",
    # httpx + beautifulsoup4 power the custom web_fetch fallback (non-Anthropic providers)
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "cronsim>=2.7",
    "cron-descriptor>=1.4",
    # gateway facade
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=15",
    # channels
    "python-telegram-bot>=21.0",
    "discord.py>=2.4",
    "slack-bolt>=1.18",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0",
    "ruff>=0.15.18,<0.17",  # pinned line; matches .pre-commit-config.yaml + the CI lint gate
    "mypy>=2.3,<2.4",
    # Each release of a pre-1.0 checker can add checks, so ty is pinned to one patch.
    "ty>=0.0.97,<0.0.98",
    "pyrefly>=1.4,<1.5",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0.0",
    "types-jsonschema>=4.26.0.20260518",
    # The unit suite and mypy exercise the Gemini and OpenAI paths, so a dev install carries both.
    "ag2[gemini,openai]>=1.3.0",
]
# Model provider libraries, none in the base install. Opt-in per provider
# (`pip install "ag2-assistant[gemini]"`) or all at once (`ag2-assistant[all]`).
gemini = ["ag2[gemini]>=1.3.0"]
anthropic = ["ag2[anthropic]>=1.3.0"]
ollama = ["ag2[ollama]>=1.3.0"]
# OpenAI API / ChatGPT-subscription model configs, OpenAI voice and transcription.
openai = ["ag2[openai]>=1.3.0"]
# Google integration (Gmail / Calendar / Drive). Opt-in: `pip install ag2-assistant[google]`.
google = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    # drive_read PDF text extraction (binary Drive files are never decoded raw)
    "pypdf>=5.0",
]
# Every provider library plus the Google integration — what the Docker image carries.
all = ["ag2-assistant[gemini,openai,anthropic,ollama,google]"]

[project.scripts]
ag2-assistant = "assistant.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests hit a real LLM / network / Docker, so they're slow and
# non-deterministic — excluded from the default run. Run them with `pytest -m
# integration` (needs API keys). `pytest -m ""` runs everything.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call a real LLM or network (require API keys)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# `files` is configured rather than passed on the command line so a bare `mypy`
# means the same thing in a terminal, in the pre-commit hook and in CI.
python_version = "3.12"
mypy_path = "src"
files = ["src/assistant"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true

# No stubs and no type marker. Named individually rather than with a global
# ignore_missing_imports, which would also silence future unresolved imports.
[[tool.mypy.overrides]]
module = ["cron_descriptor.*", "googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

# Provider extras; their import sites are lazy, so an install without them still typechecks.
[[tool.mypy.overrides]]
module = ["openai", "openai.*", "google.genai", "google.genai.*"]
ignore_missing_imports = true

[tool.ty.environment]
# Same target and source root as mypy; the interpreter is the project's .venv.
python-version = "3.12"
root = ["src"]

[tool.ty.src]
include = ["src/assistant"]

[tool.pyrefly]
project-includes = ["src/assistant"]
search-path = ["src"]
python-version = "3.12"
# The same three untyped libraries mypy names in its overrides.
ignore-missing-imports = ["cron_descriptor.*", "googleapiclient.*", "google_auth_oauthlib.*"]

[tool.codespell]
# The generated SPA bundle and lockfiles are machine-written — never spell-check them.
skip = "*.lock,*package-lock.json,src/assistant/gateway/static/app/*,.venv,node_modules"
# Not typos: `ans` (answer var), `hsi` (Hang Seng Index ticker), `protext` (a
# camelCase identifier), `padd` (Profiles.svelte's `p`-prefixed CSS class naming,
# i.e. "p-add"), `sigit` (an ACP Registry agent name), plus valid hyphenations/spellings. Extend this list when
# codespell flags a real term.
ignore-words-list = "ans,hsi,thur,unparseable,pre-empt,pre-selects,protext,padd,sigit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"assistant" = ["skills/*/SKILL.md", "cards/bundled/*.card.yaml", "cards/*.md"]
"assistant.gateway" = [
    "static/*.html",
    "static/*.svg",
    "static/app/index.html",
    "static/app/preview.html",
    "static/app/assets/*",
    "static/app/assets/*.css",
    "static/app/assets/*.js",
]
