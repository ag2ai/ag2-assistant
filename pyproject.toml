[build-system]
requires = ["setuptools>=77.0.3"]  # PEP 639: SPDX license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "ag2-assistant"
version = "0.5.0"  # single source of truth (mirrors ag2's own pyproject); assistant.version reads it back from installed metadata
description = "AG2 Assistant — a personal AI assistant powered by AG2's framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Tracks AG2 main; requires >= 1.0.0b0 (a direct git reference can't carry a
    # version floor, so the minimum is enforced by keeping main, whose version is
    # 1.0.0b0+). ddgs powers the native DuckDuckSearchTool, openai the OpenAI voice
    # provider.
    "ag2[gemini,ddgs,openai,docker] @ git+https://github.com/ag2ai/ag2.git@main",
    "typer>=0.15.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "mcp>=1.9.0",
    # httpx + beautifulsoup4 power the custom web_fetch fallback (non-Anthropic providers)
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "cronsim>=2.7",
    "cron-descriptor>=1.4",
    # gateway facade
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # channels
    "python-telegram-bot>=21.0",
    "discord.py>=2.4",
    "slack-bolt>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.18,<0.16",  # pinned line; matches .pre-commit-config.yaml + the CI lint gate
    "pre-commit>=4.0.0",
]
# Google integration (Gmail / Calendar / Drive). Opt-in: `pip install ag2-assistant[google]`.
google = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    # drive_read PDF text extraction (binary Drive files are never decoded raw)
    "pypdf>=5.0",
]

[project.scripts]
ag2-assistant = "assistant.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests hit a real LLM / network / Docker, so they're slow and
# non-deterministic — excluded from the default run. Run them with `pytest -m
# integration` (needs API keys). `pytest -m ""` runs everything.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call a real LLM or network (require API keys)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.codespell]
# The generated SPA bundle and lockfiles are machine-written — never spell-check them.
skip = "*.lock,*package-lock.json,src/assistant/gateway/static/app/*,.venv,node_modules"
# Not typos: `ans` (answer var), `hsi` (Hang Seng Index ticker), `protext` (a
# camelCase identifier), plus valid hyphenations/spellings. Extend this list when
# codespell flags a real term.
ignore-words-list = "ans,hsi,thur,unparseable,pre-empt,pre-selects,protext"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"assistant" = ["skills/*/SKILL.md"]
"assistant.gateway" = [
    "static/*.html",
    "static/*.svg",
    "static/app/index.html",
    "static/app/assets/*",
    "static/app/assets/*.css",
    "static/app/assets/*.js",
]
