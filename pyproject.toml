[build-system]
requires = ["setuptools>=77.0.3"]  # PEP 639: SPDX license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "ag2-assistant"
version = "0.5.4"  # single source of truth (mirrors ag2's own pyproject); assistant.version reads it back from installed metadata
description = "AG2 Assistant — a personal AI assistant powered by AG2's framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Dev installs, CI and the Docker image all resolve this through uv.lock, so they
    # run the same AG2 the published wheel asks for. ddgs powers the native
    # DuckDuckSearchTool, openai the OpenAI voice provider.
    "ag2[gemini,ddgs,openai,acp]>=1.0.2",
    "typer>=0.15.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "mcp>=2.0.0,<3",
    # httpx + beautifulsoup4 power the custom web_fetch fallback (non-Anthropic providers)
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "cronsim>=2.7",
    "cron-descriptor>=1.4",
    # gateway facade
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # channels
    "python-telegram-bot>=21.0",
    "discord.py>=2.4",
    "slack-bolt>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0",
    "ruff>=0.15.18,<0.17",  # pinned line; matches .pre-commit-config.yaml + the CI lint gate
    "mypy>=2.3,<2.4",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0.0",
]
# Provider client libraries not in the base install.
# Opt-in: `pip install "ag2-assistant[ollama]"`.
anthropic = ["ag2[anthropic]>=1.0.2"]
ollama = ["ag2[ollama]>=1.0.2"]
# Google integration (Gmail / Calendar / Drive). Opt-in: `pip install ag2-assistant[google]`.
google = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    # drive_read PDF text extraction (binary Drive files are never decoded raw)
    "pypdf>=5.0",
]

[project.scripts]
ag2-assistant = "assistant.cli:app"

[tool.uv.sources]
# Track ag2's main branch instead of a released version.
ag2 = { git = "https://github.com/ag2ai/ag2.git", branch = "main" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests hit a real LLM / network / Docker, so they're slow and
# non-deterministic — excluded from the default run. Run them with `pytest -m
# integration` (needs API keys). `pytest -m ""` runs everything.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call a real LLM or network (require API keys)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# `files` is configured rather than passed on the command line so a bare `mypy`
# means the same thing in a terminal, in the pre-commit hook and in CI.
python_version = "3.12"
mypy_path = "src"
files = ["src/assistant"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true

# No stubs and no type marker. Named individually rather than with a global
# ignore_missing_imports, which would also silence future unresolved imports.
[[tool.mypy.overrides]]
module = ["cron_descriptor.*", "googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.codespell]
# The generated SPA bundle and lockfiles are machine-written — never spell-check them.
skip = "*.lock,*package-lock.json,src/assistant/gateway/static/app/*,.venv,node_modules"
# Not typos: `ans` (answer var), `hsi` (Hang Seng Index ticker), `protext` (a
# camelCase identifier), `padd` (Profiles.svelte's `p`-prefixed CSS class naming,
# i.e. "p-add"), `sigit` (an ACP Registry agent name), plus valid hyphenations/spellings. Extend this list when
# codespell flags a real term.
ignore-words-list = "ans,hsi,thur,unparseable,pre-empt,pre-selects,protext,padd,sigit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"assistant" = ["skills/*/SKILL.md"]
"assistant.gateway" = [
    "static/*.html",
    "static/*.svg",
    "static/app/index.html",
    "static/app/assets/*",
    "static/app/assets/*.css",
    "static/app/assets/*.js",
]
