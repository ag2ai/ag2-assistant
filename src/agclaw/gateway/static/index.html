<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGClaw</title>
<link rel="icon" href="/faviconlight.svg" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicondark.svg" media="(prefers-color-scheme: dark)">
<link rel="shortcut icon" href="/faviconlight.svg">
<link rel="apple-touch-icon" href="/faviconlight.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/open-sauce-sans" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --ink: #171717; --muted: #737373; --line: #e6e6e6;
    --accent: #f95339; --bg: #ffffff; --panel: #fafafa; --code: #f3f3f3;
    --user-bg: #171717; --user-ink: #ffffff;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Open Sauce Sans", "Open Sauce One", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  /* Dark, when the OS asks for it and the user hasn't forced light. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ededed; --muted: #9a9a9a; --line: #2b2b2b;
      --bg: #0f0f0f; --panel: #1b1b1b; --code: #232323;
      --user-bg: #f95339; --user-ink: #ffffff;
    }
  }
  /* Explicit dark override (user toggled). */
  :root[data-theme="dark"] {
    --ink: #ededed; --muted: #9a9a9a; --line: #2b2b2b;
    --bg: #0f0f0f; --panel: #1b1b1b; --code: #232323;
    --user-bg: #f95339; --user-ink: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; height: 100vh;
    transition: background .2s ease, color .2s ease;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  header .mark {
    font-family: var(--mono); font-weight: 700; letter-spacing: 1px;
    background: var(--ink); color: var(--bg); padding: 4px 9px; border-radius: 6px; font-size: 13px;
  }
  header .title { font-family: var(--serif); font-weight: 600; font-size: 18px; }
  header .spacer { margin-left: auto; }
  header .status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c9c9c9; }
  .dot.on { background: #2ecc71; } .dot.off { background: var(--accent); }
  header button {
    font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 7px 12px; border-radius: 8px; margin-left: 10px;
  }
  header button:hover { border-color: var(--ink); }

  /* history drawer */
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 9; }
  #backdrop.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 380px; max-width: 88vw; z-index: 10;
    background: var(--bg); border-right: 1px solid var(--line); transform: translateX(-100%);
    transition: transform .2s ease; display: flex; flex-direction: column;
  }
  #drawer.open { transform: none; }
  #drawer .dhead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #drawer .dhead button#dclose { margin-left: auto; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--muted); }
  .tabs { display: flex; gap: 4px; }
  .tab { font-family: var(--serif); font-size: 16px; font-weight: 600; cursor: pointer; border: none; background: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; }
  .tab.on { color: var(--ink); background: var(--panel); }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pane[hidden] { display: none; }
  .newbtn { margin: 10px 10px 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 600; font-size: 14px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .newbtn:hover { border-color: var(--ink); }
  #sessions { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .sess { text-align: left; border: none; background: none; color: var(--ink); font-family: var(--sans);
          padding: 11px 12px; border-radius: 10px; cursor: pointer; }
  .sess:hover { background: var(--panel); }
  .sess.active { background: var(--panel); outline: 1px solid var(--line); }
  .sess .p { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #sessions .none { color: var(--muted); font-size: 13px; padding: 12px; }

  /* google modal */
  #gmodal {
    position: fixed; z-index: 11; top: 50%; left: 50%; transform: translate(-50%, -48%);
    width: 460px; max-width: 90vw; background: var(--bg); border: 1px solid var(--line);
    border-radius: 16px; padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: opacity .15s ease;
  }
  #gmodal.open { opacity: 1; pointer-events: auto; }
  #gmodal h2 { font-family: var(--serif); margin: 0 0 8px; font-size: 22px; }
  #gmodal p { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 10px; }
  #gmodal .grow { display: flex; gap: 10px; margin-top: 16px; }
  #gmodal .gbtn {
    font-family: var(--sans); font-weight: 600; font-size: 14px; cursor: pointer;
    padding: 11px 16px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
  }
  #gmodal .gbtn.secondary { background: var(--bg); color: var(--ink); border-color: var(--line); }
  #gmodal .err { color: #b3331f; }
  #gmodal input[type=file] { font-family: var(--sans); font-size: 13px; margin: 4px 0 12px; color: var(--ink); }

  #log { flex: 1; overflow-y: auto; padding: 24px; }
  .wrap { max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 80%; padding: 12px 16px; border-radius: 14px; line-height: 1.55; font-size: 15px;
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user-bg); color: var(--user-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.error .bubble { background: #fff3f1; border: 1px solid #f7c9c0; color: #b3331f; }
  .msg.note { justify-content: center; }
  .msg.note .bubble { background: transparent; color: var(--muted); font-size: 13px; padding: 4px; }

  /* markdown inside agent bubbles */
  .bubble > :first-child { margin-top: 0; } .bubble > :last-child { margin-bottom: 0; }
  .bubble p { margin: 0 0 10px; } .bubble ul, .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble h1, .bubble h2, .bubble h3 { font-family: var(--serif); margin: 14px 0 8px; line-height: 1.25; }
  .bubble h1 { font-size: 22px; } .bubble h2 { font-size: 19px; } .bubble h3 { font-size: 17px; }
  .bubble a { color: var(--accent); }
  a.tasklink { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px dashed var(--accent); cursor: pointer; }
  a.tasklink:hover { border-bottom-style: solid; }
  .bubble code { font-family: var(--mono); font-size: 13px; background: var(--code); padding: 1.5px 5px; border-radius: 5px; }
  .bubble pre { background: var(--code); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 0 0 10px; }
  .bubble pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
  .bubble blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .bubble table { border-collapse: collapse; margin: 0 0 10px; font-size: 14px; }
  .bubble th, .bubble td { border: 1px solid var(--line); padding: 5px 9px; }
  .bubble .files { display: flex; flex-direction: column; gap: 4px; }
  .bubble .file { font-size: 13px; opacity: .9; }

  /* shared markdown rendering (deliverable assets + viewer) */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; } .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md h1, .md h2, .md h3 { font-family: var(--serif); margin: 14px 0 8px; line-height: 1.25; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
  .md a { color: var(--accent); }
  .md code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 1.5px 5px; border-radius: 5px; }
  .md pre { background: var(--code); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 0 0 10px; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md table { border-collapse: collapse; margin: 0 0 10px; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; }

  /* deliverable full-view modal */
  #viewer {
    position: fixed; z-index: 12; top: 50%; left: 50%; transform: translate(-50%, -48%);
    width: 780px; max-width: 92vw; max-height: 84vh; background: var(--bg);
    border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
    display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .15s ease;
  }
  #viewer.open { opacity: 1; pointer-events: auto; }
  #viewer .vhead { display: flex; align-items: center; gap: 10px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
  #viewer .vhead h2 { font-family: var(--serif); font-size: 18px; margin: 0; flex: 1; }
  #viewer .vhead button { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  #vbody { padding: 20px 26px; overflow-y: auto; font-size: 14px; line-height: 1.6; }
  .viewbtn { margin: 2px 0 8px; font-size: 12px; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-family: var(--sans); }
  .viewbtn:hover { border-color: var(--accent); }

  .thinking .bubble { color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
  .thinking .d { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .thinking .d:nth-child(2) { animation-delay: .2s; } .thinking .d:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .msg.thinking { align-items: center; }  /* center chips against the taller dots bubble */
  .tooltrail { display: flex; flex-wrap: wrap; gap: 5px; margin-left: 8px; }
  .toolchip { font-size: 11px; color: var(--muted); background: var(--code); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-family: var(--sans); }

  .qcard {
    align-self: center; max-width: 760px; width: 100%; border: 1px solid var(--accent);
    border-radius: 14px; padding: 18px 20px; background: var(--bg);
    box-shadow: 0 8px 28px rgba(249,83,57,.10);
  }
  .qcard .kind { color: var(--accent); font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
  .qcard h3 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 6px 0 4px; }
  .qcard .detail { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
  .qcard .opts { display: flex; flex-wrap: wrap; gap: 10px; }
  .qcard button, .qcard .send {
    font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 11px 16px; border-radius: 10px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--bg);
  }
  .qcard button.secondary { background: var(--bg); color: var(--ink); }
  .qcard button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .qcard button:hover { opacity: .9; }
  .qcard .freerow { display: flex; gap: 10px; }
  .qcard input { flex: 1; padding: 11px 14px; font-family: var(--sans); font-size: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  .qcard input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

  footer { border-top: 1px solid var(--line); padding: 14px 20px; }
  .composer { max-width: 760px; margin: 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { display: flex; align-items: center; gap: 6px; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
  .chip button { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; padding: 0; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .iconbtn {
    flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 18px; cursor: pointer;
  }
  .iconbtn:hover { border-color: var(--ink); }
  .iconbtn:disabled { opacity: .5; cursor: not-allowed; }
  #mic.live { background: var(--accent); border-color: var(--accent); color: #fff; animation: micpulse 1.4s infinite; }
  @keyframes micpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(249,83,57,.5); } 50% { box-shadow: 0 0 0 6px rgba(249,83,57,0); } }
  .voicebar { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); display: none; align-items: center; gap: 8px; }
  .voicebar.on { display: flex; }
  .msg.voice .bubble { font-style: italic; }
  .msg.voice .bubble::before { content: "🎙 "; font-style: normal; }
  textarea {
    flex: 1; resize: none; font-family: var(--sans); font-size: 15px; line-height: 1.5;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; max-height: 160px;
    background: var(--bg); color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  textarea:disabled { background: var(--panel); color: var(--muted); }
  .sendbtn {
    flex: none; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer;
    padding: 12px 20px; border-radius: 12px; border: none; background: var(--accent); color: #fff;
  }
  .sendbtn.stop { background: var(--ink); color: var(--bg); }
  .empty { color: var(--muted); text-align: center; margin: 18vh auto 0; font-size: 15px; }
  .empty h1 { font-family: var(--serif); font-weight: 600; color: var(--ink); font-size: 28px; margin: 0 0 8px; }

  /* task view (takes over the main pane) */
  .taskview { max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .tvhead { display: flex; align-items: center; gap: 10px; }
  .tvhead .back { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 7px 12px; font-family: var(--sans); font-weight: 600; font-size: 13px; cursor: pointer; }
  .tvhead .back:hover { border-color: var(--ink); }
  .tvhead .tvtitle { font-family: var(--serif); font-size: 20px; flex: 1; }
  .tvtree { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 13px; background: var(--panel); }
  .tvtree .obj { color: var(--muted); margin-bottom: 8px; }
  .tvhint { color: var(--muted); font-size: 13px; text-align: center; padding: 4px; }
  .tvchat { display: flex; flex-direction: column; gap: 14px; }
  /* chat card for an agent-spawned task */
  .taskcard { align-self: flex-start; max-width: 80%; border: 1px solid var(--accent); border-radius: 14px; padding: 14px 16px; background: var(--bg); box-shadow: 0 6px 20px rgba(249,83,57,.08); }
  .taskcard .tck { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .taskcard .tci { font-weight: 600; font-size: 15px; margin: 6px 0 12px; }
  .taskcard .tcb { font-family: var(--sans); font-weight: 600; font-size: 14px; cursor: pointer; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .taskcard .tcb:hover { opacity: .9; }
  .tvhead .arch { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 8px; padding: 7px 12px; font-family: var(--sans); font-weight: 600; font-size: 13px; cursor: pointer; }
  .tvhead .arch:hover { border-color: var(--ink); color: var(--ink); }

  /* full task listing page */
  .tlist { max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .tlist .lhead { display: flex; align-items: center; gap: 10px; }
  .tlist .lhead .tvtitle { font-family: var(--serif); font-size: 20px; flex: 1; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .fchip { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; font-family: var(--sans); }
  .fchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .trow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .trow:hover { border-color: var(--ink); }
  .trow .tt { flex: 1; font-weight: 600; font-size: 14px; }
  .trow .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .viewall { padding: 8px 10px 12px; text-align: center; border-top: 1px solid var(--line); }
  .viewall button { border: none; background: none; color: var(--accent); font-family: var(--sans); font-weight: 600; font-size: 13px; cursor: pointer; }

  /* tasks drawer (right) */
  #tdrawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 90vw; z-index: 10;
    background: var(--bg); border-left: 1px solid var(--line); transform: translateX(100%);
    transition: transform .2s ease; display: flex; flex-direction: column;
  }
  #tdrawer.open { transform: none; }
  #tdrawer .dhead { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  #tdrawer .dhead h2 { font-family: var(--serif); font-size: 18px; margin: 0; }
  #tdrawer .dhead button { margin-left: auto; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--muted); }
  #tnew { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #tnew input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
  #tnew input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  #tnew button { border: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 16px; font-weight: 600; font-family: var(--sans); cursor: pointer; }
  #tbody { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .tnone { color: var(--muted); font-size: 13px; padding: 16px; text-align: center; }
  .needs { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); padding: 4px 4px 0; }
  /* HITL strip — open questions surfaced inline on every surface */
  #hitlbar { padding: 0 20px; } #hitlbar:empty { display: none; }
  .hitlinner { max-width: 760px; margin: 12px auto 0; display: flex; flex-direction: column; gap: 8px;
               max-height: 40vh; overflow-y: auto; }
  .inq { border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; background: var(--bg); box-shadow: 0 6px 20px rgba(249,83,57,.08); }
  .inq .inqsrc { border: none; background: none; color: var(--accent); font-family: var(--sans); font-weight: 600; font-size: 12px; cursor: pointer; padding: 0 0 6px; }
  .inq .inqsrc:hover { text-decoration: underline; }
  .inq .it { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .inq .idet { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .inq .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .inq .freerow { display: flex; gap: 8px; }
  .inq button { font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); }
  .inq button.secondary { background: var(--bg); color: var(--ink); }
  .inq input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; }
  .tcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tcard.needsinput { border-color: var(--accent); box-shadow: 0 6px 20px rgba(249,83,57,.08); }
  .tcard .needs { padding: 10px 0 2px; }
  .tcard .inq { margin-top: 8px; }
  .tcard .th { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .tcard .tt { font-weight: 600; font-size: 14px; flex: 1; word-break: break-word; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 3px 8px; border-radius: 999px; background: var(--panel); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .badge.running, .badge.planning { color: #fff; background: var(--accent); border-color: var(--accent); }
  .badge.completed { color: #fff; background: #2ecc71; border-color: #2ecc71; }
  .badge.failed, .badge.cancelled { color: #fff; background: #b3331f; border-color: #b3331f; }
  .badge.awaiting_input, .badge.scheduled { color: #fff; background: #e08e0b; border-color: #e08e0b; }
  .tcard .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .tcard .detail { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; }
  .tcard .obj { margin-bottom: 8px; }
  .deliv { font-size: 13px; margin: 4px 0; }
  .deliv .ds { font-size: 11px; color: var(--muted); }
  .deliv.produced .ds, .deliv.accepted .ds { color: #2ecc71; }
  .deliv.rejected .ds { color: #b3331f; }
  .asset { background: var(--code); border-radius: 8px; padding: 10px 12px; margin: 4px 0; font-size: 12.5px; max-height: 260px; overflow: auto; }
  .child { margin-left: 10px; border-left: 2px solid var(--line); padding-left: 10px; margin-top: 8px; }
  .child .chead { display: flex; gap: 8px; align-items: center; }
  .child .chead .ct { font-weight: 600; font-size: 13px; flex: 1; }
  .prog { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .prog.err { color: #b3331f; }
  .cancelbtn { margin-top: 10px; font-size: 12px; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-family: var(--sans); }
  .cancelbtn:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <header>
    <button id="menu" title="Chats & Tasks">☰</button>
    <span class="mark">AGClaw</span>
    <span class="title">Assistant</span>
    <span class="spacer"></span>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></span>
    <button id="gbtn" title="Connect Google">Google</button>
    <button id="theme" title="Theme">🖥 System</button>
  </header>

  <div id="backdrop"></div>
  <div id="gmodal"><div id="gbody"></div></div>
  <div id="viewer">
    <div class="vhead"><h2 id="vtitle"></h2><button id="vclose" title="Close">×</button></div>
    <div id="vbody" class="md"></div>
  </div>
  <aside id="drawer">
    <div class="dhead">
      <div class="tabs"><button id="tabChats" class="tab on">Chats</button><button id="tabTasks" class="tab">Tasks</button></div>
      <button id="dclose" title="Close">×</button>
    </div>
    <div id="paneChats" class="pane">
      <button id="newChat" class="newbtn">+ New chat</button>
      <div id="sessions"></div>
    </div>
    <div id="paneTasks" class="pane" hidden>
      <div id="tnew"><input id="tinput" placeholder="Start a task…"><button id="tgo">Run</button></div>
      <div id="tbody"></div>
      <div class="viewall"><button id="tallbtn">View all tasks →</button></div>
    </div>
  </aside>

  <div id="hitlbar"></div>
  <div id="log"><div class="wrap"><div class="empty"><h1>How can I help?</h1>Ask me anything — I can search, run code, read files, and more.</div></div></div>

  <footer>
    <div class="composer">
      <div class="chips" id="chips"></div>
      <div class="row">
        <button class="iconbtn" id="attach" title="Attach files">📎</button>
        <input type="file" id="file" multiple hidden>
        <textarea id="input" rows="1" placeholder="Message AGClaw…" autofocus></textarea>
        <button class="iconbtn" id="astask" title="Run this as a task">✓</button>
        <button class="iconbtn" id="mic" title="Talk to AGClaw">🎙</button>
        <button class="sendbtn" id="send">Send</button>
      </div>
      <div class="voicebar" id="voicebar"><span id="voicestate">●</span><span id="voicetext">Voice off</span></div>
    </div>
  </footer>

<script>
(function () {
  const log = document.getElementById("log");
  const wrap = log.querySelector(".wrap");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const attachBtn = document.getElementById("attach");
  const fileInput = document.getElementById("file");
  const chips = document.getElementById("chips");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const themeBtn = document.getElementById("theme");
  const menuBtn = document.getElementById("menu");
  const drawer = document.getElementById("drawer");
  const backdrop = document.getElementById("backdrop");
  const sessionsEl = document.getElementById("sessions");
  const MAX_BYTES = 20 * 1024 * 1024;

  if (window.marked) marked.setOptions({ breaks: true, gfm: true });

  // --- theme: system (default) → light → dark, persisted ---
  const THEMES = ["system", "light", "dark"];
  const LABEL = { system: "🖥 System", light: "☀️ Light", dark: "🌙 Dark" };
  function applyTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    themeBtn.textContent = LABEL[t];
  }
  let theme = localStorage.getItem("agclaw_theme") || "system";
  applyTheme(theme);
  themeBtn.onclick = () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    localStorage.setItem("agclaw_theme", theme);
    applyTheme(theme);
  };

  // One stable session per browser.
  let sessionId = localStorage.getItem("agclaw_session");
  if (!sessionId) { sessionId = "web-" + Math.random().toString(36).slice(2, 10); localStorage.setItem("agclaw_session", sessionId); }

  let ws, thinkingEl = null, busy = false, pending = [];

  // --- left drawer: Chats | Tasks tabs ---
  const tabChats = document.getElementById("tabChats"), tabTasks = document.getElementById("tabTasks");
  const paneChats = document.getElementById("paneChats"), paneTasks = document.getElementById("paneTasks");
  let drawerTab = "chats", tpoll = null;
  function stopTaskPoll() { if (tpoll) { clearInterval(tpoll); tpoll = null; } }
  function openDrawer(o, tab) {
    if (tab) drawerTab = tab;
    drawer.classList.toggle("open", o); backdrop.classList.toggle("open", o);
    if (o) refreshTab(); else stopTaskPoll();
  }
  function setTab(tab) { drawerTab = tab; refreshTab(); }
  function refreshTab() {
    stopTaskPoll();
    const chats = drawerTab === "chats";
    tabChats.classList.toggle("on", chats); tabTasks.classList.toggle("on", !chats);
    paneChats.hidden = !chats; paneTasks.hidden = chats;
    if (chats) loadSessions();
    else { loadTasks(); tpoll = setInterval(loadTasks, 3000); }
  }
  function relTime(iso) {
    if (!iso) return "";
    try {
      const s = (Date.now() - new Date(iso).getTime()) / 1000;
      if (s < 60) return "just now";
      if (s < 3600) return Math.floor(s / 60) + "m ago";
      if (s < 86400) return Math.floor(s / 3600) + "h ago";
      return Math.floor(s / 86400) + "d ago";
    } catch { return ""; }
  }
  async function loadSessions() {
    try {
      const data = await (await fetch("/api/sessions")).json();
      const list = data.sessions || [];
      sessionsEl.innerHTML = "";
      if (!list.length) { sessionsEl.innerHTML = '<div class="none">No past conversations yet.</div>'; return; }
      list.forEach(s => {
        const b = document.createElement("button");
        b.className = "sess" + (s.session_id === sessionId ? " active" : "");
        const p = document.createElement("div"); p.className = "p"; p.textContent = s.preview || "(empty)";
        const m = document.createElement("div"); m.className = "m";
        m.textContent = s.turns + " turn" + (s.turns === 1 ? "" : "s") + " · " + relTime(s.updated);
        b.appendChild(p); b.appendChild(m);
        b.onclick = () => { switchSession(s.session_id); openDrawer(false); };
        sessionsEl.appendChild(b);
      });
    } catch { /* offline — leave list as-is */ }
  }
  async function switchSession(id) {
    leaveTaskMode();
    sessionId = id; localStorage.setItem("agclaw_session", id);
    await loadTranscript(id);
  }
  async function loadTranscript(id) {
    try {
      const data = await (await fetch("/api/sessions/" + encodeURIComponent(id))).json();
      const msgs = data.messages || [];
      wrap.innerHTML = "";
      if (!msgs.length) {
        wrap.innerHTML = '<div class="empty"><h1>How can I help?</h1>Ask me anything — I can search, run code, read files, and more.</div>';
        return;
      }
      msgs.forEach(m => addMsg(m.role === "user" ? "user" : "agent", m.text));
    } catch { /* leave current view */ }
  }
  menuBtn.onclick = () => openDrawer(!drawer.classList.contains("open"));
  backdrop.onclick = () => {
    if (viewer.classList.contains("open")) { closeViewer(); return; }  // dismiss viewer first
    openDrawer(false); closeGoogle();
  };
  document.getElementById("dclose").onclick = () => openDrawer(false);
  tabChats.onclick = () => setTab("chats");
  tabTasks.onclick = () => setTab("tasks");
  document.getElementById("newChat").onclick = doNewChat;

  // --- deliverable viewer (roomy, rendered markdown) ---
  const viewer = document.getElementById("viewer");
  function openViewer(title, text) {
    document.getElementById("vtitle").textContent = title || "Deliverable";
    renderMarkdown(document.getElementById("vbody"), text || "");
    viewer.classList.add("open"); backdrop.classList.add("open");
  }
  function closeViewer() {
    viewer.classList.remove("open");
    // drop the dim backdrop unless the drawer / google modal still needs it
    if (!drawer.classList.contains("open") && !gmodal.classList.contains("open"))
      backdrop.classList.remove("open");
  }
  document.getElementById("vclose").onclick = closeViewer;

  // --- tasks pane (lives in the left drawer's Tasks tab) ---
  const tbody = document.getElementById("tbody");
  const tinput = document.getElementById("tinput");

  function badge(status) {
    const b = document.createElement("span");
    b.className = "badge " + status; b.textContent = (status || "").replace(/_/g, " ");
    return b;
  }
  function formatWhen(iso) {
    if (!iso) return "";
    try { return new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); }
    catch { return iso; }
  }
  function schedLabel(t) {  // "⏰ Jun 17, 05:00 · repeats daily" / "· one-off"
    if (!t.scheduled_for) return "";
    return "⏰ " + formatWhen(t.scheduled_for) + " · " + (t.recurrence ? "repeats " + t.recurrence : "one-off");
  }
  async function loadTasks() {
    let tasks = [];
    try { tasks = (await (await fetch("/api/tasks")).json()).tasks || []; } catch { return; }
    renderTasks(tasks);
  }
  let lastSig = "";
  function renderTasks(tasks) {
    // preserve focus in an inquiry text field across the refresh
    const active = document.activeElement;
    if (active && active.tagName === "INPUT" && active.closest(".inq")) return;
    // only rebuild the DOM when something actually changed — otherwise the 3s
    // poll would churn the list and steal clicks on inquiry option buttons.
    const sig = JSON.stringify(tasks.map(t => [
      t.id, t.status, t.deliverables_done, t.deliverables, t.children,
      t.last_progress, (t.inquiries || []).map(q => q.id),
    ]));
    if (sig === lastSig) return;
    lastSig = sig;
    tbody.innerHTML = "";
    if (!tasks.length) { tbody.innerHTML = '<div class="tnone">No tasks yet. Start one above.</div>'; return; }
    tasks.forEach(t => tbody.appendChild(taskCard(t)));
  }
  function inquiryCard(p, onAnswered, showContext) {
    const c = document.createElement("div"); c.className = "inq";
    if (showContext && p.task_title) {  // which task is asking — and jump to it
      const src = document.createElement("button"); src.className = "inqsrc";
      const ttl = p.task_title.length > 70 ? p.task_title.slice(0, 70) + "…" : p.task_title;
      src.textContent = "↳ from task: " + ttl;
      src.onclick = () => { if (p.root_id) openTaskView(p.root_id); };
      c.appendChild(src);
    }
    const it = document.createElement("div"); it.className = "it";
    it.textContent = (p.kind === "permission" ? "🔒 " : "❓ ") + (p.text || ""); c.appendChild(it);
    if (p.detail) { const d = document.createElement("div"); d.className = "idet"; d.textContent = p.detail; c.appendChild(d); }
    async function answer(v) {
      await fetch("/api/inquiries/" + p.id + "/answer", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answer: v }),
      });
      (onAnswered || loadTasks)();
    }
    if (p.options && p.options.length) {
      const o = document.createElement("div"); o.className = "opts";
      const deny = new Set(["deny", "no", "cancel", "decline", "reject"]);
      p.options.forEach(opt => {
        const b = document.createElement("button");
        b.className = deny.has(String(opt).trim().toLowerCase()) ? "secondary" : "";
        b.textContent = opt; b.onclick = () => answer(opt); o.appendChild(b);
      });
      c.appendChild(o);
    } else {
      const row = document.createElement("div"); row.className = "freerow";
      const i = document.createElement("input"); i.placeholder = "Your answer…";
      const b = document.createElement("button"); b.textContent = "Send";
      const go = () => { const v = i.value.trim(); if (v) answer(v); };
      b.onclick = go; i.onkeydown = (e) => { if (e.key === "Enter") go(); };
      row.appendChild(i); row.appendChild(b); c.appendChild(row);
    }
    return c;
  }
  function taskCard(t) {
    const inqs = t.inquiries || [];
    const c = document.createElement("div"); c.className = "tcard" + (inqs.length ? " needsinput" : "");
    const th = document.createElement("div"); th.className = "th";
    const tt = document.createElement("div"); tt.className = "tt"; tt.textContent = t.title;
    th.appendChild(tt); th.appendChild(badge(t.status)); c.appendChild(th);
    const meta = document.createElement("div"); meta.className = "meta";
    if (t.status === "scheduled") {
      meta.textContent = schedLabel(t);  // ⏰ next run · repeats …
    } else {
      let m = t.deliverables_done + "/" + t.deliverables + " deliverables";
      if (t.children) m += " · " + t.children + " subtask" + (t.children === 1 ? "" : "s");
      if (t.last_progress) m += " · " + t.last_progress;
      meta.textContent = m;
    }
    c.appendChild(meta);
    // open questions are NOT shown here — they live in the global HITL strip
    // (with task context), so the side panel stays a clean task list.
    th.onclick = () => openTaskView(t.id);  // clicking a task opens its full view
    return c;
  }
  // --- task view (takes over the main pane): tree + a task-scoped chat ---
  let taskMode = null, taskPoll = null, taskTreeEl = null, taskChatEl = null, taskTitleEl = null, lastTreeSig = "";

  let listMode = false;
  function leaveTaskMode() {
    taskMode = null; taskTreeEl = taskChatEl = taskTitleEl = null; listMode = false;
    if (taskPoll) { clearInterval(taskPoll); taskPoll = null; }
    input.placeholder = "Message AGClaw…"; input.disabled = false; sendBtn.disabled = false;
  }
  function exitTaskView() { leaveTaskMode(); loadTranscript(sessionId); }

  // --- full task listing page (history + filters) ---
  async function openTaskList(filter) {
    leaveTaskMode(); openDrawer(false); closeViewer();
    listMode = true; const f = filter || "all";
    wrap.innerHTML = "";
    const view = document.createElement("div"); view.className = "tlist";
    const head = document.createElement("div"); head.className = "lhead";
    const back = document.createElement("button"); back.className = "back"; back.textContent = "← Chat"; back.onclick = exitTaskView;
    const title = document.createElement("span"); title.className = "tvtitle"; title.textContent = "All tasks";
    head.appendChild(back); head.appendChild(title); view.appendChild(head);
    const filters = document.createElement("div"); filters.className = "filters";
    [["all", "All"], ["active", "Active"], ["completed", "Completed"], ["stopped", "Stopped"], ["archived", "Archived"]].forEach(([k, label]) => {
      const c = document.createElement("button"); c.className = "fchip" + (k === f ? " on" : ""); c.textContent = label;
      c.onclick = () => openTaskList(k); filters.appendChild(c);
    });
    view.appendChild(filters);
    const rows = document.createElement("div"); rows.textContent = "Loading…"; view.appendChild(rows);
    wrap.appendChild(view);
    let tasks = [];
    try { tasks = (await (await fetch("/api/tasks/all" + (f === "all" ? "" : "?status=" + f))).json()).tasks || []; } catch {}
    rows.innerHTML = "";
    if (!tasks.length) { rows.innerHTML = '<div class="tnone">No tasks here.</div>'; return; }
    tasks.forEach(t => {
      const r = document.createElement("div"); r.className = "trow";
      const tt = document.createElement("span"); tt.className = "tt"; tt.textContent = t.title;
      const when = document.createElement("span"); when.className = "when";
      when.textContent = (t.status === "scheduled" && t.scheduled_for) ? schedLabel(t) : relTime(t.created_at);
      r.appendChild(tt); r.appendChild(badge(t.status)); r.appendChild(when);
      r.onclick = () => openTaskView(t.id);
      rows.appendChild(r);
    });
  }
  document.getElementById("tallbtn").onclick = () => openTaskList("all");

  async function openTaskView(id) {
    openDrawer(false); closeViewer();
    taskMode = id; lastTreeSig = "";
    wrap.innerHTML = "";
    const view = document.createElement("div"); view.className = "taskview";
    const head = document.createElement("div"); head.className = "tvhead";
    const back = document.createElement("button"); back.className = "back"; back.textContent = "← Chat"; back.onclick = exitTaskView;
    taskTitleEl = document.createElement("span"); taskTitleEl.className = "tvtitle"; taskTitleEl.textContent = "Task";
    const arch = document.createElement("button"); arch.className = "arch"; arch.id = "tvarch"; arch.textContent = "Archive";
    head.appendChild(back); head.appendChild(taskTitleEl); head.appendChild(arch); view.appendChild(head);
    taskTreeEl = document.createElement("div"); taskTreeEl.className = "tvtree"; taskTreeEl.textContent = "Loading…"; view.appendChild(taskTreeEl);
    const hint = document.createElement("div"); hint.className = "tvhint";
    hint.textContent = "Ask below to change this task — add/cancel subtasks, tweak the objective, reschedule it, or cancel it.";
    view.appendChild(hint);
    taskChatEl = document.createElement("div"); taskChatEl.className = "tvchat"; view.appendChild(taskChatEl);
    wrap.appendChild(view);
    input.placeholder = "Tell the agent to change this task…"; input.focus();
    await refreshTaskTree();
    taskPoll = setInterval(refreshTaskTree, 3000);
  }
  async function refreshTaskTree() {
    if (!taskMode || !taskTreeEl) return;
    let full; try { full = (await (await fetch("/api/tasks/" + taskMode)).json()).task; } catch { return; }
    if (!full) { taskTreeEl.textContent = "(task unavailable)"; return; }
    // only rebuild when the task actually changed, so the poll doesn't churn the
    // tree and steal clicks on 'Open full' / cancel buttons.
    const sig = JSON.stringify(full);
    if (sig === lastTreeSig) return;
    lastTreeSig = sig;
    if (taskTitleEl) { taskTitleEl.textContent = full.title + " "; taskTitleEl.appendChild(badge(full.status)); }
    const arch = document.getElementById("tvarch");
    if (arch) {
      const terminal = ["completed", "failed", "cancelled"].includes(full.status);
      // archive is only for finished tasks; active ones are Cancelled, not archived
      arch.style.display = (full.archived || terminal) ? "" : "none";
      arch.textContent = full.archived ? "Unarchive" : "Archive";
      arch.onclick = async () => {
        await fetch("/api/tasks/" + taskMode + "/archive", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ archived: !full.archived }),
        });
        exitTaskView();
      };
    }
    taskTreeEl.innerHTML = "";
    if (full.scheduled_for) { const sc = document.createElement("div"); sc.className = "obj"; sc.textContent = schedLabel(full); taskTreeEl.appendChild(sc); }
    if (full.objective) { const o = document.createElement("div"); o.className = "obj"; o.textContent = full.objective; taskTreeEl.appendChild(o); }
    taskTreeEl.appendChild(nodeView(full));
    if (["pending", "scheduled", "awaiting_input", "planning", "running"].includes(full.status)) {
      const cb = document.createElement("button"); cb.className = "cancelbtn"; cb.textContent = "Cancel task";
      cb.onclick = async () => { await fetch("/api/tasks/" + taskMode + "/cancel", { method: "POST" }); refreshTaskTree(); };
      taskTreeEl.appendChild(cb);
    }
  }
  function addTaskMsg(role, text) {
    if (!taskChatEl) return null;
    const m = document.createElement("div"); m.className = "msg " + role;
    const b = document.createElement("div"); b.className = "bubble";
    if (role.split(" ")[0] === "user") b.textContent = text || ""; else renderMarkdown(b, text);
    m.appendChild(b); taskChatEl.appendChild(m); scroll();
    return m;
  }
  async function taskChat(text) {
    addTaskMsg("user", text);
    input.disabled = true; sendBtn.disabled = true;
    const thinking = addTaskThinking();  // show "…" while the (blocking) reply is fetched
    try {
      const r = await (await fetch("/api/tasks/" + taskMode + "/chat", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
      })).json();
      if (thinking) thinking.remove();
      addTaskMsg("agent", r.reply || "(no reply)");
    } catch { if (thinking) thinking.remove(); addTaskMsg("error", "⚠ Couldn't reach the task."); }
    input.disabled = false; sendBtn.disabled = false; input.focus();
    refreshTaskTree();
  }
  function addTaskThinking() {
    if (!taskChatEl) return null;
    const m = document.createElement("div"); m.className = "msg agent thinking";
    m.innerHTML = '<div class="bubble"><span class="d"></span><span class="d"></span><span class="d"></span></div>';
    taskChatEl.appendChild(m); scroll(); return m;
  }
  function nodeView(n) {
    const w = document.createElement("div");
    (n.deliverables || []).forEach(dl => {
      const r = document.createElement("div"); r.className = "deliv " + (dl.status || "");
      r.textContent = "• " + dl.description;
      const s = document.createElement("span"); s.className = "ds"; s.textContent = " [" + dl.status + "]"; r.appendChild(s);
      w.appendChild(r);
      if (dl.asset) {
        const a = document.createElement("div"); a.className = "asset md"; renderMarkdown(a, dl.asset); w.appendChild(a);
        const open = document.createElement("button"); open.className = "viewbtn"; open.textContent = "⤢ Open full";
        open.onclick = () => openViewer(dl.description, dl.asset); w.appendChild(open);
      }
      else if (dl.notes && dl.status === "rejected") { const nn = document.createElement("div"); nn.className = "prog err"; nn.textContent = "↻ " + dl.notes; w.appendChild(nn); }
    });
    const prog = n.progress || [];
    if (prog.length) { const p = document.createElement("div"); p.className = "prog"; p.textContent = "› " + prog[prog.length - 1].message; w.appendChild(p); }
    if (n.error) { const e = document.createElement("div"); e.className = "prog err"; e.textContent = "⚠ " + n.error; w.appendChild(e); }
    (n.children || []).forEach(ch => {
      const c = document.createElement("div"); c.className = "child";
      const h = document.createElement("div"); h.className = "chead";
      const ct = document.createElement("span"); ct.className = "ct"; ct.textContent = ch.title;
      h.appendChild(ct); h.appendChild(badge(ch.status)); c.appendChild(h);
      c.appendChild(nodeView(ch)); w.appendChild(c);
    });
    return w;
  }
  // Tasks "Start a task…" box → converse with the universal agent to create it.
  function startTaskFromBox() {
    const v = tinput.value.trim(); if (!v) return;
    tinput.value = ""; newTaskConversation(v);
  }
  document.getElementById("tgo").onclick = startTaskFromBox;
  tinput.onkeydown = (e) => { if (e.key === "Enter") startTaskFromBox(); };
  // composer ✓ → turn what's typed into a task (same conversational create)
  document.getElementById("astask").onclick = () => {
    const v = input.value.trim();
    if (!v) { openDrawer(true, "tasks"); return; }
    input.value = ""; input.style.height = "auto";
    newTaskConversation(v);
  };

  // --- Google connect panel ---
  const gbtn = document.getElementById("gbtn");
  const gmodal = document.getElementById("gmodal");
  const gbody = document.getElementById("gbody");
  let gpoll = null;
  function closeGoogle() {
    gmodal.classList.remove("open"); backdrop.classList.remove("open");
    if (gpoll) { clearInterval(gpoll); gpoll = null; }
  }
  async function openGoogle() {
    gmodal.classList.add("open"); backdrop.classList.add("open");
    await renderGoogle();
  }
  async function renderGoogle() {
    let st;
    try { st = await (await fetch("/api/google/status")).json(); }
    catch { gbody.innerHTML = "<h2>Google</h2><p>Gateway offline.</p>"; return; }

    if (st.signed_in) {
      gbody.innerHTML = "<h2>Google connected</h2><p>Signed in as <b>" +
        (st.email || "your account") + "</b>. AGClaw can use Gmail, Calendar and Drive " +
        "(sending an email or creating an event will ask you to approve first).</p>";
      const row = document.createElement("div"); row.className = "grow";
      const dc = document.createElement("button"); dc.className = "gbtn secondary"; dc.textContent = "Disconnect";
      dc.onclick = async () => { await fetch("/api/google/logout", { method: "POST" }); renderGoogle(); };
      const done = document.createElement("button"); done.className = "gbtn"; done.textContent = "Done"; done.onclick = closeGoogle;
      row.appendChild(dc); row.appendChild(done); gbody.appendChild(row);
      return;
    }

    if (!st.configured) {
      gbody.innerHTML = "<h2>Connect Google</h2><p>Add your Google OAuth client: in Google Cloud " +
        "enable the Gmail, Calendar &amp; Drive APIs, create a <b>Desktop OAuth client</b>, " +
        "and upload its JSON here.</p>";
      const f = document.createElement("input"); f.type = "file"; f.accept = "application/json,.json";
      f.onchange = async () => {
        const file = f.files[0]; if (!file) return;
        const r = await (await fetch("/api/google/credentials", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: await file.text() }),
        })).json();
        if (r.ok) renderGoogle();
        else { const e = document.createElement("p"); e.className = "err"; e.textContent = "⚠ " + r.error; gbody.appendChild(e); }
      };
      gbody.appendChild(f);
      return;
    }

    // configured but not signed in
    gbody.innerHTML = "<h2>Connect Google</h2><p>Open Google's consent page and authorise AGClaw, " +
      "then return here. (Open the link on this machine — the sign-in completes locally.)</p>";
    const btn = document.createElement("button"); btn.className = "gbtn"; btn.textContent = "Open Google consent →";
    btn.onclick = async () => {
      const r = await (await fetch("/api/google/login_url", { method: "POST" })).json();
      if (!r.ok) { gbody.insertAdjacentHTML("beforeend", '<p class="err">⚠ ' + (r.error || "Could not start sign-in") + "</p>"); return; }
      window.open(r.auth_url, "_blank");
      gbody.innerHTML = '<h2>Waiting for Google…</h2><p>Complete consent in the opened tab — this updates automatically.</p>' +
        '<p style="font-size:12px">If nothing opened, <a href="' + r.auth_url + '" target="_blank">click here</a>.</p>';
      gpoll = setInterval(async () => {
        try { const s = await (await fetch("/api/google/status")).json(); if (s.signed_in) { clearInterval(gpoll); gpoll = null; renderGoogle(); } } catch {}
      }, 2000);
    };
    gbody.appendChild(btn);
  }
  gbtn.onclick = () => { gmodal.classList.contains("open") ? closeGoogle() : openGoogle(); };

  function scroll() { log.scrollTop = log.scrollHeight; }
  function clearEmpty() { const e = wrap.querySelector(".empty"); if (e) e.remove(); }

  function renderMarkdown(el, text) {
    if (window.marked && window.DOMPurify) {
      el.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
      el.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    } else { el.textContent = text || ""; }
    linkifyTasks(el);
  }

  // Turn bare task IDs in rendered text (e.g. "(Task ID: task-e37d…)") into
  // clickable links that open the task — so a reloaded chat still links through,
  // not just the live card. Runs after sanitize so it survives DOMPurify.
  const TASK_ID_RE = /\btask-[0-9a-f]{6,}\b/g;
  function linkifyTasks(el) {
    if (!el) return;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (n.parentElement && n.parentElement.closest("a"))
        ? NodeFilter.FILTER_REJECT
        : (TASK_ID_RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP),
    });
    const targets = [];
    while (walker.nextNode()) targets.push(walker.currentNode);
    for (const node of targets) {
      const frag = document.createDocumentFragment();
      let last = 0; const s = node.nodeValue; TASK_ID_RE.lastIndex = 0; let m;
      while ((m = TASK_ID_RE.exec(s))) {
        if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
        const a = document.createElement("a");
        a.href = "#"; a.className = "tasklink"; a.textContent = m[0];
        const id = m[0];
        a.onclick = (ev) => { ev.preventDefault(); openTaskView(id); };
        frag.appendChild(a);
        last = m.index + m[0].length;
      }
      if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }

  function addMsg(role, text, files) {
    clearEmpty();
    const m = document.createElement("div");
    m.className = "msg " + role;
    const b = document.createElement("div");
    b.className = "bubble";
    if (role === "agent") renderMarkdown(b, text);
    else b.textContent = text || "";
    if (files && files.length) {
      const fl = document.createElement("div"); fl.className = "files";
      files.forEach(f => { const d = document.createElement("div"); d.className = "file"; d.textContent = "📎 " + f.name; fl.appendChild(d); });
      b.appendChild(fl);
    }
    m.appendChild(b); wrap.appendChild(m); scroll();
    return m;
  }

  function addNote(text) { addMsg("note", text); }

  function addTaskCard(m) {  // a chat card for a task the agent spawned
    clearEmpty();
    const card = document.createElement("div"); card.className = "taskcard";
    const t = document.createElement("div"); t.className = "tck"; t.textContent = "✓ Task started";
    const ti = document.createElement("div"); ti.className = "tci"; ti.textContent = m.title || "Task";
    const b = document.createElement("button"); b.className = "tcb"; b.textContent = "Open task →";
    b.onclick = () => openTaskView(m.id);
    card.appendChild(t); card.appendChild(ti); card.appendChild(b);
    wrap.appendChild(card); scroll();
  }

  function showThinking() {
    clearEmpty();
    thinkingEl = document.createElement("div");
    thinkingEl.className = "msg agent thinking";
    thinkingEl.innerHTML = '<div class="bubble"><span class="d"></span><span class="d"></span><span class="d"></span></div><div class="tooltrail"></div>';
    wrap.appendChild(thinkingEl); scroll();
  }
  function clearThinking() { if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; } }
  function addToolChip(name) {  // live "⚙ tool name" chips under the thinking dots
    if (!thinkingEl) return;
    const trail = thinkingEl.querySelector(".tooltrail");
    if (!trail) return;
    const pretty = String(name || "").replace(/_/g, " ");
    const last = trail.lastElementChild;  // collapse repeats of the same tool
    if (last && last.dataset.tool === pretty) {
      const n = (parseInt(last.dataset.count || "1", 10)) + 1;
      last.dataset.count = String(n);
      last.textContent = "⚙ " + pretty + " ×" + n;
      scroll(); return;
    }
    const chip = document.createElement("span");
    chip.className = "toolchip";
    chip.dataset.tool = pretty; chip.dataset.count = "1";
    chip.textContent = "⚙ " + pretty;
    trail.appendChild(chip); scroll();
  }

  function setBusy(on) {
    busy = on;
    input.disabled = on; attachBtn.disabled = on;
    sendBtn.textContent = on ? "Stop" : "Send";
    sendBtn.classList.toggle("stop", on);
    if (!on) input.focus();
  }

  // --- attachments ---
  function renderChips() {
    chips.innerHTML = "";
    pending.forEach((f, i) => {
      const c = document.createElement("div"); c.className = "chip";
      const n = document.createElement("span"); n.textContent = "📎 " + f.name;
      const x = document.createElement("button"); x.textContent = "×"; x.title = "Remove";
      x.onclick = () => { pending.splice(i, 1); renderChips(); };
      c.appendChild(n); c.appendChild(x); chips.appendChild(c);
    });
  }
  attachBtn.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    [...fileInput.files].forEach(file => {
      if (file.size > MAX_BYTES) { addNote("⚠ " + file.name + " is too large (max 20 MB)."); return; }
      const r = new FileReader();
      r.onload = () => { pending.push({ name: file.name, mime: file.type || "application/octet-stream", data: String(r.result).split(",")[1] || "" }); renderChips(); };
      r.readAsDataURL(file);
    });
    fileInput.value = "";
  };

  function showQuestion(q) {
    clearThinking();
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = '<div class="kind">' + (q.kind === "permission" ? "Permission" : "Question") + '</div><h3></h3>';
    card.querySelector("h3").textContent = q.text || "";
    if (q.detail) { const d = document.createElement("div"); d.className = "detail"; d.textContent = q.detail; card.appendChild(d); }
    function answer(value) { send({ type: "answer", id: q.id, answer: value }); card.remove(); addMsg("user", value); showThinking(); }
    if (q.options && q.options.length) {
      const opts = document.createElement("div"); opts.className = "opts";
      const deny = new Set(["deny", "no", "cancel", "decline", "reject"]);
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        const lower = String(opt).trim().toLowerCase();
        btn.className = deny.has(lower) ? "secondary" : (i === 0 ? "primary" : "");
        btn.textContent = opt; btn.onclick = () => answer(opt); opts.appendChild(btn);
      });
      card.appendChild(opts);
    } else {
      const row = document.createElement("div"); row.className = "freerow";
      const tin = document.createElement("input"); tin.type = "text"; tin.placeholder = "Type your answer…";
      const go = document.createElement("button"); go.className = "primary"; go.textContent = "Send";
      const submit = () => { const v = tin.value.trim(); if (v) answer(v); };
      go.onclick = submit; tin.onkeydown = (e) => { if (e.key === "Enter") submit(); };
      row.appendChild(tin); row.appendChild(go); card.appendChild(row);
      setTimeout(() => tin.focus(), 0);
    }
    wrap.appendChild(card); scroll();
  }

  function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(proto + "://" + location.host + "/api/ws");
    ws.onopen = () => { dot.className = "dot on"; statusText.textContent = "connected"; };
    ws.onclose = () => { dot.className = "dot off"; statusText.textContent = "reconnecting…"; setBusy(false); setTimeout(connect, 1500); };
    ws.onerror = () => { dot.className = "dot off"; statusText.textContent = "offline"; };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "thinking") showThinking();
      else if (m.type === "tool") addToolChip(m.name);
      else if (m.type === "question") showQuestion(m);
      else if (m.type === "reply") { clearThinking(); addMsg("agent", m.text); setBusy(false); if (drawer.classList.contains("open")) refreshTab(); }
      else if (m.type === "task_card") { addTaskCard(m); }
      else if (m.type === "cancelled") { clearThinking(); addNote("⏹ Stopped."); setBusy(false); }
      else if (m.type === "error") { clearThinking(); addMsg("error", "⚠ " + (m.message || "Something went wrong.")); setBusy(false); }
    };
  }

  function sendMessage(surface, textOverride) {
    if (taskMode && textOverride == null) {  // in the task view the composer steers the task
      const t = input.value.trim(); if (!t) return;
      input.value = ""; input.style.height = "auto"; taskChat(t); return;
    }
    if (listMode) { listMode = false; wrap.innerHTML = ""; }  // a chat message leaves the listing
    if (busy && textOverride == null) { send({ type: "cancel", session_id: sessionId }); return; }  // Stop
    const text = (textOverride != null ? textOverride : input.value).trim();
    if (!text && !pending.length) return;
    const files = pending.slice();
    addMsg("user", text, files);
    if (textOverride == null) { input.value = ""; input.style.height = "auto"; }
    pending = []; renderChips();
    setBusy(true);
    send({ text: text, session_id: sessionId, attachments: files, surface: surface || "" });
  }

  // Start a new task as a CONVERSATION with the universal agent (it clarifies if
  // needed, then creates it) — used by the Tasks "Start a task" box and the
  // composer's ✓ button. A fresh chat session so it doesn't bleed into the current one.
  function newTaskConversation(text) {
    if (!text) return;
    leaveTaskMode(); openDrawer(false);
    sessionId = "web-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("agclaw_session", sessionId);
    wrap.innerHTML = "";
    sendMessage("new_task", text);
  }

  sendBtn.onclick = () => sendMessage();
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
  function doNewChat() {
    leaveTaskMode(); openDrawer(false);
    sessionId = "web-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("agclaw_session", sessionId);
    pending = []; renderChips();
    wrap.innerHTML = '<div class="empty"><h1>How can I help?</h1>New conversation started.</div>';
  }

  // --- HITL strip: open questions, visible & answerable on every surface ---
  const hitlbar = document.getElementById("hitlbar");
  let hitlSig = "";
  function afterHitlAnswer() {
    pollInquiries();
    if (drawer.classList.contains("open")) loadTasks();
    if (taskMode) refreshTaskTree();
  }
  async function pollInquiries() {
    let pend = [];
    try { pend = (await (await fetch("/api/inquiries/pending")).json()).pending || []; } catch { return; }
    const active = document.activeElement;  // don't clobber a free-text answer being typed
    if (active && active.tagName === "INPUT" && active.closest("#hitlbar")) return;
    const sig = JSON.stringify(pend.map(p => p.id));
    if (sig === hitlSig) return;
    hitlSig = sig;
    hitlbar.innerHTML = "";
    if (!pend.length) return;
    const inner = document.createElement("div"); inner.className = "hitlinner";
    const head = document.createElement("div"); head.className = "needs";
    head.textContent = "Needs your input (" + pend.length + ")";
    inner.appendChild(head);
    pend.forEach(p => inner.appendChild(inquiryCard(p, afterHitlAnswer, true)));
    hitlbar.appendChild(inner);
  }
  pollInquiries();
  setInterval(pollInquiries, 4000);

  // ---- Voice: full-duplex talk with AGClaw (Gemini Live over /api/voice) ----
  // Browser captures mic at 16 kHz mono PCM (Gemini Live's required input),
  // streams it as binary; receives 24 kHz PCM speech (binary) it plays back, plus
  // user/agent transcripts (JSON) shown as bubbles. Transcripts stream in chunks,
  // so we append to the current bubble per role until the other side speaks.
  const micBtn = document.getElementById("mic");
  const voicebar = document.getElementById("voicebar");
  const voicetext = document.getElementById("voicetext");
  let voiceWS = null, micCtx = null, micNode = null, micStream = null;
  let playCtx = null, playHead = 0;
  let vbubble = null, vrole = null;  // current streaming transcript bubble + its role
  let vthinking = null;              // "…" bubble shown after you stop, until the agent replies

  function voiceStatus(on, text) {
    voicebar.classList.toggle("on", on);
    if (text) voicetext.textContent = text;
  }
  function isTaskView() { return !!taskMode; }
  function voiceBubble(role, text) {
    if (role === "agent") hideVoiceThinking();  // first agent output ends "thinking"
    const cls = (role === "user" ? "user" : "agent") + " voice";
    // route to whichever surface is showing (task view or chat)
    const adder = isTaskView() ? addTaskMsg : addMsg;
    if (vbubble && vrole === role) {
      const b = vbubble.querySelector(".bubble");
      if (b) { b.textContent = (b.textContent || "") + text; scroll(); return; }
    }
    vbubble = adder(cls, text); vrole = role;
  }
  function finalizeUser(text) {  // replace the streamed user bubble with the final transcript
    if (vbubble && vrole === "user") {
      const b = vbubble.querySelector(".bubble");
      if (b && text) b.textContent = text;
    } else if (text) {
      voiceBubble("user", text);
    }
    vbubble = null; vrole = null;  // the agent's reply starts a fresh bubble
  }
  function showVoiceThinking() {
    if (vthinking) return;
    const host = isTaskView() ? taskChatEl : wrap;
    if (!host) return;
    vthinking = document.createElement("div"); vthinking.className = "msg agent thinking";
    vthinking.innerHTML = '<div class="bubble"><span class="d"></span><span class="d"></span><span class="d"></span></div>';
    host.appendChild(vthinking); scroll();
  }
  function hideVoiceThinking() { if (vthinking) { vthinking.remove(); vthinking = null; } }
  function addVoiceToolChip(name) {  // same ⚙ chips as the chat, on the voice thinking bubble
    showVoiceThinking();
    let trail = vthinking.querySelector(".tooltrail");
    if (!trail) { trail = document.createElement("div"); trail.className = "tooltrail"; vthinking.appendChild(trail); }
    const pretty = String(name || "").replace(/_/g, " ");
    const last = trail.lastElementChild;
    if (last && last.dataset.tool === pretty) {
      const n = (parseInt(last.dataset.count || "1", 10)) + 1;
      last.dataset.count = String(n); last.textContent = "⚙ " + pretty + " ×" + n; scroll(); return;
    }
    const chip = document.createElement("span");
    chip.className = "toolchip"; chip.dataset.tool = pretty; chip.dataset.count = "1";
    chip.textContent = "⚙ " + pretty; trail.appendChild(chip); scroll();
  }

  async function startVoice() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    } catch { voiceStatus(true, "Mic permission denied"); setTimeout(() => voiceStatus(false), 2500); return; }
    voiceStatus(true, "Connecting…"); micBtn.classList.add("live");
    const proto = location.protocol === "https:" ? "wss" : "ws";
    // bind voice to whatever the user is looking at: the open task, else this chat session
    const q = isTaskView() ? "?task=" + encodeURIComponent(taskMode)
                           : "?session=" + encodeURIComponent(sessionId);
    voiceWS = new WebSocket(proto + "://" + location.host + "/api/voice" + q);
    voiceWS.binaryType = "arraybuffer";

    voiceWS.onmessage = (ev) => {
      if (typeof ev.data === "string") {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === "ready") voiceStatus(true, "Listening…");
        else if (m.type === "transcript") {
          if (m.role === "user" && m.final) { finalizeUser(m.text); showVoiceThinking(); voiceStatus(true, "Working…"); }
          else voiceBubble(m.role, m.text);
        }
        else if (m.type === "tool") addVoiceToolChip(m.name);
        else if (m.type === "error") { voiceStatus(true, "Voice error: " + (m.message || "")); }
        return;
      }
      hideVoiceThinking(); voiceStatus(true, "Listening…");  // audio means the agent is replying
      playPCM(new Int16Array(ev.data));  // 24 kHz mono PCM from Gemini
    };
    voiceWS.onclose = () => stopVoice(false);
    voiceWS.onerror = () => voiceStatus(true, "Voice connection error");

    // 16 kHz capture context + an inline AudioWorklet that ships Int16 frames.
    micCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const workletSrc = `
      class PCM16 extends AudioWorkletProcessor {
        process(inputs) {
          const ch = inputs[0][0];
          if (ch) {
            const pcm = new Int16Array(ch.length);
            for (let i = 0; i < ch.length; i++) { let s = Math.max(-1, Math.min(1, ch[i])); pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
            this.port.postMessage(pcm.buffer, [pcm.buffer]);
          }
          return true;
        }
      }
      registerProcessor('pcm16', PCM16);`;
    await micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSrc], { type: "application/javascript" })));
    const src = micCtx.createMediaStreamSource(micStream);
    micNode = new AudioWorkletNode(micCtx, "pcm16");
    micNode.port.onmessage = (e) => { if (voiceWS && voiceWS.readyState === WebSocket.OPEN) voiceWS.send(e.data); };
    src.connect(micNode);  // worklet has no output; pulls input only

    // 24 kHz playback context (Gemini output rate).
    playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    playHead = 0;
  }

  function playPCM(int16) {
    if (!playCtx) return;
    const f32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 0x8000;
    const buf = playCtx.createBuffer(1, f32.length, 24000);
    buf.getChannelData(0).set(f32);
    const node = playCtx.createBufferSource(); node.buffer = buf; node.connect(playCtx.destination);
    const now = playCtx.currentTime;
    if (playHead < now) playHead = now;
    node.start(playHead); playHead += buf.duration;  // queue back-to-back
  }

  function stopVoice(closeWS = true) {
    micBtn.classList.remove("live"); voiceStatus(false);
    vbubble = null; vrole = null; hideVoiceThinking();
    if (micNode) { try { micNode.port.onmessage = null; micNode.disconnect(); } catch {} micNode = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (micCtx) { micCtx.close().catch(() => {}); micCtx = null; }
    if (playCtx) { playCtx.close().catch(() => {}); playCtx = null; }
    if (closeWS && voiceWS) { try { voiceWS.close(); } catch {} }
    voiceWS = null;
  }

  micBtn.onclick = () => { voiceWS ? stopVoice() : startVoice(); };

  loadTranscript(sessionId);  // restore this conversation's history on load
  connect();
})();
</script>
</body>
</html>
