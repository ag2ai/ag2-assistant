name: MarketBoard
description: Use when the answer is market prices — stocks, shares, ETFs, funds,
  indices or crypto. The first quote is the lead; the rest are the movers.

fields:
  title:
    type: string
    description: Board heading, e.g. 'Technology'.
  currency:
    type: string
    description: Board currency if all quotes share one.
  status:
    type: string
    description: "Market state if all quotes agree: 'open'/'closed'/'pre'/'after'."
  asOf:
    type: string
    description: Timestamp of the quotes (ISO-8601).
  source:
    type: string
  quotes:
    type: array
    description: Most important first — the first quote is drawn as the lead.
    items:
      type: object
      properties:
        symbol: {type: string, description: "Ticker, e.g. 'AAPL' or '^AXJO'."}
        name: {type: string, description: "Instrument name, e.g. 'Apple Inc.'."}
        price: {type: number}
        change: {type: number, description: Absolute change vs previous close.}
        changePercent: {type: number, description: Percent change vs previous close.}
        currency: {type: string, description: "ISO code, e.g. 'USD', 'AUD'."}
        exchange: {type: string}
        dayLow: {type: number}
        dayHigh: {type: number}
        spark:
          type: array
          items: {type: number}
          description: Optional normalised intraday points (0-100) for the sparkline.
        state:
          type: string
          description: "Trading state if known: 'open', 'closed', 'pre', 'after'."
        note:
          type: string
          description: Optional one-line driver for the lead, only if genuinely known.
      required: [symbol, name, price, changePercent]
      additionalProperties: false
required: [title, quotes]

layout:
  - {id: root, component: Card, variant: feature, child: board}
  - id: board
    component: Column
    gap: lg
    children: [masthead, rule_mast, lead, movers_block, foot_block]

  - {id: masthead, component: Row, justify: between, align: end, gap: md, children: [mast_left, mast_right]}
  - {id: mast_left, component: Column, gap: none, grow: true, children: [kicker, board_title]}
  - {id: kicker, component: Text, text: Markets, variant: eyebrow, tone: accent}
  - {id: board_title, component: Text, text: {path: /title}, variant: h1}
  - {id: mast_right, component: Column, gap: none, align: end, children: [status, currency]}
  - id: status
    component: Text
    text: {path: /status}
    map: {open: Market open, closed: Market closed, pre: Pre-market, after: After hours}
    variant: caption
    emphasis: strong
  - {id: currency, component: Text, text: {path: /currency}, variant: caption, tone: muted}
  - {id: rule_mast, component: Divider}

  - {id: lead, component: Row, gap: lg, align: center, children: [lead_text, lead_chart]}
  - {id: lead_text, component: Column, gap: sm, grow: true, children: [lead_tag, lead_symbol, lead_id, lead_metric, lead_range, lead_note]}
  - {id: lead_tag, component: Text, text: Lead, variant: eyebrow, tone: accent}
  - {id: lead_symbol, component: Text, text: {path: /quotes/0/symbol}, variant: h2}
  - {id: lead_id, component: Row, gap: xs, align: center, children: [lead_name, lead_dot, lead_exchange]}
  - {id: lead_name, component: Text, text: {path: /quotes/0/name}, variant: caption, tone: muted}
  - {id: lead_dot, component: Text, text: '·', variant: caption, tone: muted, when: {path: /quotes/0/exchange}}
  - {id: lead_exchange, component: Text, text: {path: /quotes/0/exchange}, variant: caption, tone: muted}
  - id: lead_metric
    component: Metric
    value: {path: /quotes/0/price}
    unit: {path: /quotes/0/currency}
    delta: {path: /quotes/0/change}
    deltaPercent: {path: /quotes/0/changePercent}
    tone: {path: /quotes/0/changePercent}
    size: lg
  - id: lead_range
    component: Row
    gap: lg
    when: {path: /quotes/0/dayHigh}
    children: [lead_low, lead_high]
  - {id: lead_low, component: Metric, label: Day low, value: {path: /quotes/0/dayLow}, size: sm}
  - {id: lead_high, component: Metric, label: Day high, value: {path: /quotes/0/dayHigh}, size: sm}
  - {id: lead_note, component: Text, text: {path: /quotes/0/note}, variant: quote}
  - id: lead_chart
    component: Sparkline
    values: {path: /quotes/0/spark}
    tone: {path: /quotes/0/changePercent}
    size: lg

  # Drawn only when there is a second quote to be a mover.
  - id: movers_block
    component: Column
    gap: md
    when: {path: /quotes/1}
    children: [rule_lead, movers_head, movers]
  - {id: rule_lead, component: Divider, emphasis: strong}
  - {id: movers_head, component: Text, text: Movers, variant: eyebrow, tone: muted}
  - {id: movers, component: List, gap: none, children: {componentId: mover, path: /quotes, start: 1}}
  - {id: mover, component: Column, gap: none, children: [mover_rule, mover_row]}
  - {id: mover_rule, component: Divider}
  - {id: mover_row, component: Row, align: center, gap: md, children: [mover_id, mover_metric, mover_spark]}
  - {id: mover_id, component: Column, gap: none, grow: true, children: [mover_symbol, mover_name]}
  - {id: mover_symbol, component: Text, text: {path: ./symbol}, variant: h4}
  - {id: mover_name, component: Text, text: {path: ./name}, variant: caption, tone: muted}
  - id: mover_metric
    component: Metric
    value: {path: ./price}
    unit: {path: ./currency}
    deltaPercent: {path: ./changePercent}
    tone: {path: ./changePercent}
    size: sm
    align: end
  - {id: mover_spark, component: Sparkline, values: {path: ./spark}, tone: {path: ./changePercent}, size: sm}

  - id: foot_block
    component: Column
    gap: md
    when: [{path: /source}, {path: /asOf}]
    children: [rule_foot, foot]
  - {id: rule_foot, component: Divider}
  - {id: foot, component: Row, justify: between, gap: md, children: [foot_source, foot_asof]}
  - {id: foot_source, component: Row, gap: xs, when: {path: /source}, children: [foot_source_label, foot_source_value]}
  - {id: foot_source_label, component: Text, text: 'Source:', variant: caption, tone: muted}
  - {id: foot_source_value, component: Text, text: {path: /source}, variant: caption}
  - {id: foot_asof, component: Row, gap: xs, when: {path: /asOf}, children: [foot_asof_label, foot_asof_value]}
  - {id: foot_asof_label, component: Text, text: as of, variant: caption, tone: muted}
  - {id: foot_asof_value, component: Text, text: {path: /asOf}, variant: caption, format: time}

