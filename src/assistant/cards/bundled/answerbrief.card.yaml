name: AnswerBrief
description: Use when the answer is a structured brief — a research summary, a
  recommendation or a set of tradeoffs — with no competing options to compare.

topic: a research summary or a recommendation
fields:
  topic:
    type: string
    description: What the brief is about, in one line.
  sections:
    type: array
    items:
      type: string
    description: One paragraph per part of the answer, including its explanation.
required: [topic, sections]

layout:
  - {id: root, component: Column, children: [topic, sections]}
  - {id: topic, component: Text, text: {path: /topic}, variant: h4}
  - {id: sections, component: Column, gap: sm, when: {path: /sections}, children: {componentId: section, path: /sections}}
  - {id: section, component: Text, text: {path: .}, variant: body}

example:
  topic: Rust vs Go for a small CLI
  sections:
    - Both languages start quickly enough for a small command-line tool.
    - Go offers a simpler build setup; Rust gives more control over the binary size.
