# The SPA bundle under static/app/ is generated by `npm run build` (committed so
# deploy stays Python-only). Never lint/reformat generated build output.
exclude: '^src/assistant/gateway/static/app/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Keep the committed SPA bundle in sync with its source. Any change to a Vite
      # build input under web/ rebuilds static/app and stages it into the same commit,
      # so the bundle can't drift (mirrors the CI "SPA bundle is up to date" gate).
      # Requires Node/npm on PATH; only runs when a web/ build input is staged.
      - id: build-web-bundle
        name: rebuild SPA bundle (web/ → static/app)
        language: system
        files: '^web/(src/.*|package\.json|package-lock\.json|vite\.config\.js|index\.html)$'
        pass_filenames: false
        entry: bash -c 'cd web && npm run build && cd .. && git add src/assistant/gateway/static/app'
